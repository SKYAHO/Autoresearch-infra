schema_version: 1
environment: dev

gcp:
  project_id: autoresearch-503903
  region: asia-northeast3
  zone: asia-northeast3-a
  name_prefix: autoresearch
  resource_prefix: autoresearch-dev

gke:
  cluster_name: autoresearch-dev-gke
  master_ipv4_cidr: 172.16.0.0/28
  pods_cidr: 172.16.64.0/20
  services_cidr: 172.16.128.0/24

network:
  dev_subnet_cidr: 10.10.0.0/20
  private_services_cidr: 192.168.0.0/20
  redis_psc_subnet_cidr: 10.10.16.0/29

state:
  bucket: autoresearch-503903-dev-tfstate
  roots:
    terraform/envs/dev: dev/
    terraform/admin/airflow-k8s: admin/airflow-k8s/
    terraform/admin/argo-rollouts-k8s: admin/argo-rollouts-k8s/
    terraform/admin/argocd-k8s: admin/argocd-k8s/
    terraform/admin/autoresearch-k8s: admin/autoresearch-k8s/
    terraform/admin/elastic-k8s: admin/elastic-k8s/
    terraform/admin/gke-team-access: admin/gke-team-access/
    terraform/admin/mlflow-k8s: admin/mlflow-k8s/
    terraform/admin/monitoring-k8s: admin/monitoring-k8s/
    # vault-k8s: #478로 root 디렉터리는 삭제됐지만, state 정리 절차
    # (docs/superpowers/specs/2026-08-02-vault-removal-design.md)가 이
    # backend-config 좌표에 의존한다. state 정리 완료 전까지 유지.
    #
    # ⚠️ 주의(claude-review 8차 지적, 실측 확인): 디렉터리가 없는 지금
    # `scripts/terraform-env --environment dev --root terraform/admin/vault-k8s
    # init`을 그냥 실행하면 `environment_catalog.rb`의
    # `write_terraform_inputs!`가 `FileUtils.mkdir_p`로 빈 디렉터리를
    # 조용히 재생성하고 그 안에 `.environment.auto.tfvars.json`/
    # `.environment.backend.hcl`(진짜 bucket/prefix 포함)만 써 넣는다.
    # `.tf` 파일이 하나도 없어 backend 블록 선언 자체가 없으므로
    # `-backend-config`는 무시되고 `terraform init`은 "빈 디렉터리에서
    # 초기화됨"으로 로컬 상태로 끝난다(원격 backend 연결 없음, live
    # state는 건드리지 않음 — 실측 확인). 즉 실 리소스를 건드리는
    # 위험은 아니지만, 복원 절차(위 spec 문서)를 건너뛰고 이 명령부터
    # 실행하면 코드 없이 입력 파일만 있는 사용 불가능한 디렉터리가
    # git 워킹트리에 조용히 생겨 혼란을 준다 — 반드시 spec 문서의
    # "승인 후 실행할 vault-k8s admin root state 정리 절차"대로 root
    # 코드를 먼저 복원한 뒤 실행한다.
    terraform/admin/vault-k8s: admin/vault-k8s/
