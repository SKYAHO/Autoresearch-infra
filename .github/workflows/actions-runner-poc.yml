# #533 셀프 호스티드 러너(ARC) PoC. 러너 Pod가 실제로 뜨고, VPC 내부망
# (Kubernetes API server)에 egress NetworkPolicy를 통해 도달하는지만
# 확인하는 비파괴적 워크플로우다. 다른 트리거에 얹지 않고 수동 실행만 허용한다.
#
# kubectl이 아니라 curl을 쓴다 — 기본 러너 이미지(ghcr.io/actions/actions-runner)
# 에는 kubectl이 없다(계획 작성 시의 가정을 구현 중 정정). 인증 토큰 없이
# 호출하므로 401/403도 "연결은 됐다"는 성공 신호다 — TLS 핸드셰이크까지
# 도달하지 못하면(NetworkPolicy 차단) curl이 timeout/connection refused로
# 실패한다. NetworkPolicy 임시 제거 검증(Task 7)의 실패 신호가 이 차이다.

name: Actions Runner PoC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: actions-runner-poc
    steps:
      - name: Kubernetes API 도달성 확인
        run: |
          set -uo pipefail
          http_code=$(curl -sk -o /dev/null -w '%{http_code}' \
            --connect-timeout 5 --max-time 10 \
            https://kubernetes.default.svc/healthz)
          curl_exit=$?

          {
            echo "## Actions Runner PoC 결과"
            echo
            echo "- \`curl\` exit code: ${curl_exit}"
            echo "- HTTP status: ${http_code:-없음}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$curl_exit" -ne 0 ]; then
            echo "kubernetes.default.svc에 연결하지 못했습니다 (exit ${curl_exit}) — NetworkPolicy egress 또는 DNS 확인 필요"
            exit 1
          fi

          echo "kubernetes.default.svc 연결 성공 (HTTP ${http_code}, 인증 없이 호출했으므로 401/403도 정상)"
