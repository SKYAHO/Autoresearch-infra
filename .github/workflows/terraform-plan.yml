name: Terraform Plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # dev root, 재사용 module, 또는 이 workflow 변경 시에만 실행 — 문서만
    # 바꾼 PR에서 GCP 인증/plan/댓글 낭비 방지. admin root는 의도적으로 제외:
    # 별도 state이며 팀원 개인 이메일이 plan 댓글에 노출되지 않게 로컬 plan만 사용.
    paths:
      - "terraform/envs/dev/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write        # GitHub OIDC 토큰 발급 (GCP WIF 인증)
  contents: read         # 코드 체크아웃
  pull-requests: write   # PR 댓글 게시

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 인증 전에 카탈로그와 GitHub 변수를 대조한다. 카탈로그가 만드는
      # .environment.auto.tfvars.json이 TF_VAR_보다 우선하므로, 불일치를 명시적으로
      # 잡지 않으면 인증 대상과 대상 프로젝트가 갈린 채 조용히 진행된다.
      - name: dev 카탈로그와 bootstrap anchor 대조
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          catalog_project="$(ruby scripts/environment_catalog.rb \
            --catalog config/environments/dev/environment.yaml \
            --field gcp.project_id)"
          if [ -z "$CONFIGURED_PROJECT_ID" ] || [ "$CONFIGURED_PROJECT_ID" != "$catalog_project" ]; then
            echo "::error::GCP_PROJECT_ID가 dev 환경 카탈로그와 일치하지 않습니다"
            exit 1
          fi
          echo "카탈로그 project_id 일치 확인"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.CI_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # backend 없이 init (fmt/validate 용)
      - run: scripts/terraform-env --environment dev --root terraform/envs/dev init -backend=false
      - run: terraform -chdir=terraform/envs/dev fmt -recursive -check -no-color
      - run: scripts/terraform-env --environment dev --root terraform/envs/dev validate -no-color

      # backend 포함 init (plan 용, state 참조)
      - run: scripts/terraform-env --environment dev --root terraform/envs/dev init -reconfigure -no-color

      - name: terraform plan
        id: plan
        continue-on-error: true
        env:
          # tfvars 가 gitignored 라 CI에 변수값이 없다. GitHub variables 에서 주입.
          TF_VAR_labels: ${{ vars.TF_LABELS_JSON || '{}' }}
          TF_VAR_master_authorized_networks: ${{ vars.MASTER_AUTHORIZED_NETWORKS || '[]' }}
        # plan 원문은 runner 임시파일에만 둔다(공개 PR 코멘트에 게시 금지).
        # 공개 코멘트에는 리소스 주소 헤더 + 요약만 게시하므로, 여기서 안전한
        # 요약(속성 diff 라인 제외 = 값 노출 없음)을 추출해 둔다.
        run: |
          set -o pipefail
          scripts/terraform-env --environment dev --root terraform/envs/dev plan -no-color -input=false > /tmp/plan.out 2>&1
          # allowlist: '# <addr> will be/must be/has moved to ...' 리소스
          # 주소 헤더와 'Plan:'/'No changes' 요약 라인만. 속성값/오류 텍스트는
          # 포함하지 않는다. 'has moved to'/'(moved from ...)'는 #468에서
          # 추가 — 전자는 moved-only, 후자는 move+change 병존 케이스('#
          # <new> will be updated in-place' + '# (moved from <old>)' 두 줄
          # 렌더링)에서 주소 이동 사실이 누락되지 않게 한다.
          # 'will no longer be managed by Terraform'은 #478 작업 중 추가 —
          # removed 블록(forget) 대상의 plan 헤더가 이 문구라 위 패턴
          # 어디에도 매칭되지 않았다(apply.yml/terraform-drift.yml과 동일한
          # 버그, 4차 리뷰에서 이 파일만 누락 지적됨). #478 자체는
          # 최종적으로 removed 블록 대신 config 유지(kms_vault_orphan.tf,
          # prevent_destroy)로 설계를 바꿔 이 문구를 만들지 않지만, 이
          # 저장소의 다른 root가 향후 removed 블록을 쓸 때를 대비한 일반
          # 방어 fix로 유지한다. 이 워크플로는 PR에 직접 게시되는 plan
          # 요약이라 forget 대상 주소 유실 시 리뷰어가 가장 먼저 놓치는
          # 지점이다.
          grep -E '^[[:space:]]*# .+ (will be|must be|has moved to) |^[[:space:]]*# .+ will no longer be managed by Terraform|^[[:space:]]*# \(moved from .+\)$|^Plan: [0-9]|^No changes\.' \
            /tmp/plan.out > /tmp/plan.summary || true

      - name: PR 댓글 게시
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcome = process.env.PLAN_OUTCOME;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (outcome === 'success') {
              let summary = '';
              try { summary = fs.readFileSync('/tmp/plan.summary', 'utf8').trim(); } catch (e) {}
              if (!summary) summary = '(변경 요약 없음 — No changes 이거나 요약 추출 실패)';
              // 방어적 상한. 요약 라인은 리소스 주소뿐이라 값 노출은 없다.
              body = [
                '### Terraform Plan — ✅ plan success',
                '',
                '변경 요약(리소스 주소·action). 상세 diff는 Actions 로그 참조 — 원문 plan은 공개하지 않습니다.',
                '',
                '```text',
                summary.slice(0, 20000),
                '```',
                '',
                `전체 로그: ${runUrl}`,
              ].join('\n');
            } else {
              // plan 실패: 오류 텍스트에 민감정보가 섞일 수 있어 게시하지 않는다.
              body = [
                `### Terraform Plan — ⚠️ plan ${outcome}`,
                '',
                `plan이 실패했습니다. 오류 원문은 공개하지 않으며 Actions 로그에서 확인하세요.`,
                '',
                `전체 로그: ${runUrl}`,
              ].join('\n');
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: plan 실패 처리
        if: steps.plan.outcome != 'success'
        run: exit 1
