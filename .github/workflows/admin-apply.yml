# #307/#312 admin root(terraform/admin/*) gated 일괄 apply.
# 운영자가 수동 트리거 → 전 root plan 요약 → GitHub Environment(admin-apply) 승인
# → 전 root 순차 apply. 민감 tfvars(allowlist 이메일)는 로컬 tfvars가 아니라 GitHub
# Secrets 단일 원천에서 온다(#305 재발 방지). OAuth client secret 등 K8s Secret
# payload는 operator가 별도 주입한다(terraform 밖).
#
# 파이프라인 구현은 dev-apply와 공유한다(`terraform-apply.yml`). 이 파일이
# 진입점으로 남는 이유: apply SA의 WIF 가장 조건이 `admin-apply.yml@main`
# workflow_ref로 고정돼 있고(OIDC workflow_ref = 최상위 호출 워크플로우),
# 승인 Environment·concurrency도 target별로 분리해야 한다.
name: admin-apply

on:
  workflow_dispatch: {}

permissions:
  id-token: write # GitHub OIDC → GCP WIF
  contents: read

concurrency:
  group: admin-apply
  cancel-in-progress: false

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply.yml
    secrets: inherit
    with:
      # apply 순서: 의존성 고려(namespace 소유 root 먼저, argocd는 다른 namespace를
      # 참조하므로 마지막). #404 신선 클러스터의 "namespaces airflow not found"는
      # root 간 순서 문제가 아니라 airflow-k8s **내부**의 ns 의존 간선 누락
      # (airflow_components Role — #436에서 depends_on 보강)이었다. cross-root
      # 참조는 실측상 없어 현행 순서를 유지한다.
      #
      # 신선 클러스터 재구축 시 선행 단계(#436 — docs/CHANGE_HISTORY.md 2026-07-29
      # 항목 요약, 실행형 상세는 docs/MIGRATION_RUNBOOK.md(#443에서 추가)):
      # 1) CRD 의존 root(elastic-k8s·argocd-k8s)는 operator helm만 로컬 -target
      #    선적용(CRD 없이는 CR plan 자체가 불가) 2) oauth-proxy류가 참조하는
      #    operator 주입 Secret을 선주입(없으면 rollout 대기 10분 타임아웃).
      #
      # gke-team-access는 제외한다(#314): 프로젝트 IAM 외에
      # BigQuery dataset·Artifact Registry repo IAM까지 관리해 apply SA에 bigquery.admin
      # + artifactregistry.admin까지 필요한 과도한 escalation이라, 사람 IAM은 로컬
      # break-glass로 유지한다. vault-k8s도 제외한다(#412): 2026-07-15 드랍 결정된
      # 샌드박스인데 목록에 남아 있어 #404 이전 후 옛 프로젝트 좌표로 apply를
      # 시도했다. root 자체는 후속 PR에서 제거한다.
      roots: >-
        terraform/admin/autoresearch-k8s
        terraform/admin/airflow-k8s
        terraform/admin/monitoring-k8s
        terraform/admin/elastic-k8s
        terraform/admin/mlflow-k8s
        terraform/admin/argo-rollouts-k8s
        terraform/admin/argocd-k8s
      plan_prefix: gs://autoresearch-503903-dev-tfstate/admin-apply-plans
      environment: admin-apply
      # admin root는 plan에도 클러스터 read가 필요해 plan·apply 모두 전용 apply SA를
      # 쓴다(dev root와 다른 점 — dev는 plan을 읽기 전용 CI SA로 수행).
      plan_service_account: ${{ vars.ADMIN_APPLY_SA_EMAIL }}
      apply_service_account: ${{ vars.ADMIN_APPLY_SA_EMAIL }}
      guard_admin_allowlist: true
