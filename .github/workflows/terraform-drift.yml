# #153 Terraform drift 감지. merge된 코드와 실제 인프라의 불일치를 매일
# 확인하고, drift가 있으면 이슈로 알린다(#79 미적용 스택 재발 방지).
# CI SA의 기존 viewer 권한만 사용한다 — apply 권한 없음(자동 apply 아님).
# admin root는 GKE master 접근 불가로 대상 외(terraform-plan.yml과 동일 사유).
#
# #478 머지 후 승인 apply 전까지는 `kms_vault_orphan.tf` 관련 리소스가
# 매일 "drift"(exitcode 2)로 잡혀 이 job이 매번 실패한다 — 예상된
# 상태이며, 실제 새 drift와 구분하는 방법은
# docs/VAULT_OPERATIONS_RUNBOOK.md의 "머지~승인 apply 사이 예상 drift"
# 절 참조.

name: Terraform Drift Detect

on:
  schedule:
    - cron: "23 0 * * *" # 매일 09:23 KST
  workflow_dispatch:

permissions:
  id-token: write # GCP WIF 인증
  contents: read
  issues: write # drift 이슈 생성/코멘트

jobs:
  drift:
    # schedule은 fork에서도 정의될 수 있으므로 원본 저장소로 한정
    if: github.repository == 'SKYAHO/Autoresearch-infra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 인증 전에 카탈로그와 GitHub 변수를 대조한다. 카탈로그가 만드는
      # .environment.auto.tfvars.json이 TF_VAR_보다 우선하므로, 불일치를 명시적으로
      # 잡지 않으면 인증 대상과 대상 프로젝트가 갈린 채 조용히 진행된다.
      - name: dev 카탈로그와 bootstrap anchor 대조
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          catalog_project="$(ruby scripts/environment_catalog.rb \
            --catalog config/environments/dev/environment.yaml \
            --field gcp.project_id)"
          if [ -z "$CONFIGURED_PROJECT_ID" ] || [ "$CONFIGURED_PROJECT_ID" != "$catalog_project" ]; then
            echo "::error::GCP_PROJECT_ID가 dev 환경 카탈로그와 일치하지 않습니다"
            exit 1
          fi
          echo "카탈로그 project_id 일치 확인"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.CI_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: scripts/terraform-env --environment dev --root terraform/envs/dev init -reconfigure -no-color

      - name: terraform plan (drift check)
        id: plan
        continue-on-error: true
        env:
          TF_VAR_labels: ${{ vars.TF_LABELS_JSON || '{}' }}
          TF_VAR_master_authorized_networks: ${{ vars.MASTER_AUTHORIZED_NETWORKS || '[]' }}
        # -detailed-exitcode: 0=일치, 1=오류, 2=drift.
        # plan 원문은 runner 임시파일에만 둔다(공개 이슈에 게시 금지). 공개
        # 이슈에는 리소스 주소·요약만 올리므로 안전한 요약을 추출해 둔다.
        run: |
          set +e
          scripts/terraform-env --environment dev --root terraform/envs/dev plan -no-color -input=false -detailed-exitcode > /tmp/plan.out 2>&1
          code=$?
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          # allowlist: 리소스 주소 헤더(will be/must be/has moved to/
          # (moved from ...)/will no longer be managed by Terraform)와
          # Plan:/No changes 요약 줄만 통과시킨다 — 속성값·오류 텍스트는
          # 제외한다. 각 alternative가 필요한 이유·이 정규식이 4개 workflow
          # 파일에서 순서까지 동일하게 유지돼야 하는 이유는
          # docs/superpowers/specs/2026-08-02-vault-removal-design.md의
          # "grep allowlist 정규식 통일" 절 참조.
          grep -E '^[[:space:]]*# .+ (will be|must be|has moved to) |^[[:space:]]*# \(moved from .+\)$|^[[:space:]]*# .+ will no longer be managed by Terraform|^Plan: [0-9]|^No changes\.' \
            /tmp/plan.out > /tmp/plan.summary || true
          # 이 step 자체는 항상 성공 처리하고 판정은 아래 step에서 한다
          exit 0

      - name: drift/오류 시 이슈 생성 또는 코멘트
        if: steps.plan.outputs.exitcode != '0'
        uses: actions/github-script@v7
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const code = process.env.PLAN_EXITCODE;
            const kind = code === '2' ? 'drift 감지' : 'plan 오류';
            const marker = '[DRIFT] dev root 코드-인프라 불일치';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const header = [
              `자동 감지(${new Date().toISOString()}): **${kind}** (exit ${code})`,
              '',
              'merge된 코드와 실제 인프라가 일치하지 않거나 plan이 실패했습니다.',
              '원인 확인 후 apply 완결 또는 코드 정정이 필요합니다.',
              '',
              `전체 로그: ${runUrl}`,
            ];
            let detail;
            if (code === '2') {
              // drift: 리소스 주소·action 요약만(속성 diff/값 라인 제외). 원문 미게시.
              let summary = '';
              try { summary = fs.readFileSync('/tmp/plan.summary', 'utf8').trim(); } catch (e) {}
              if (!summary) summary = '(변경 요약 추출 실패 — Actions 로그 확인)';
              detail = ['', '변경 리소스 요약(주소·action):', '', '```text', summary.slice(0, 20000), '```'];
            } else {
              // plan 오류(exit 1): 오류 원문에 민감정보가 섞일 수 있어 게시하지 않는다.
              detail = ['', 'plan 오류 원문은 공개하지 않습니다. Actions 로그에서 확인하세요.'];
            }
            const body = [...header, ...detail].join('\n');
            // label 3종으로 좁혀 조회 — open 이슈+PR 100개 초과 시 기존
            // [DRIFT] 이슈가 첫 페이지에서 밀려 중복 생성되는 것을 방지
            // (리뷰 반영). labels 필터는 모든 라벨을 가진 이슈만 반환한다.
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
              labels: 'bug,terraform,gcp',
            });
            const existing = issues.find(i => i.title.startsWith(marker) && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: marker,
                body,
                labels: ['bug', 'terraform', 'gcp'],
              });
            }

      - name: 결과 판정
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "plan exit=${{ steps.plan.outputs.exitcode }} (2=drift, 1=오류)"
          exit 1
