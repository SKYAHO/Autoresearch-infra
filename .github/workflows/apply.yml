# #451 apply workflow 단일 진입점. admin-apply(#307/#312)·dev-apply(#341)·
# terraform-apply(#448 재사용 워크플로우) 3개 파일을 이 하나로 통합했다.
# 한 번의 dispatch가 dev root + admin root 7개(총 8개) 전체를 plan하고,
# **승인 1회**로 전체를 apply한다(`scope: all`, 기본값).
#
# ## 전제 조건 — merge 전 반드시 확인
#
# GitHub은 워크플로우가 참조하는 Environment가 없으면 **보호 규칙 없이
# 자동 생성**하고 job을 즉시 실행한다. `apply` Environment(reviewer 6인)가
# 먼저 만들어져 있지 않은 채 이 파일이 main에 올라가면 승인 게이트가 조용히
# 사라진다(#455 리뷰). 이 워크플로우를 도입한 PR에서는 GitHub API로 미리
# `apply` Environment + required reviewers를 생성해 확인했다 — 이후 이
# 워크플로우를 다른 저장소에 이식하거나 Environment를 재생성할 때는 **먼저**
# Environment를 만들고 나서 dispatch 가능한 상태로 만들어야 한다.
#
# ## `scope` 입력 — 부분 적용과 신선도 완화
#
# `workflow_dispatch.inputs.scope`(all/dev/admin, 기본 all)로 dev root만,
# admin root만, 또는 전체를 고를 수 있다. 두 가지 이유로 필요하다.
#
# 1) **부트스트랩/재구축**: admin root(`data.google_container_cluster` 등)는
#    GKE 클러스터가 이미 있어야 plan이 된다. 신선 클러스터에서는
#    `scope: dev`로 먼저 dev root만 적용해 클러스터를 만든 뒤,
#    `scope: all`(또는 `admin`)로 admin root를 적용해야 한다
#    (`docs/MIGRATION_RUNBOOK.md` Phase 3). `scope` 없이는 admin root plan
#    실패가 dev root apply까지 막아 로컬 break-glass가 강제된다.
# 2) **plan 신선도**: 이 workflow는 admin root plan을 **dev root apply 이전**
#    시점의 상태로 계산한다(승인 1회를 지키기 위한 설계상 선택 — #455 리뷰).
#    dev root 변경이 admin root가 조회하는 live 값(GKE 클러스터 속성 등)에
#    영향을 주고, 같은 dispatch의 admin root가 그 최신값을 즉시 참조해야
#    하는 경우 이 dispatch에서는 반영되지 않을 수 있다. 그런 의존이 있는
#    변경은 `scope: dev`로 먼저 적용해 완료를 확인한 뒤, 별도 dispatch로
#    `scope: admin`(또는 `all`)을 실행한다. Terraform 자체의 stale-plan
#    보호(저장된 plan의 상태 lineage 검사)는 **그 root 자신의 원격 state**만
#    보호하고, 다른 root의 apply로 바뀐 live 조회 값(data source)까지는
#    잡아내지 못한다 — 그래서 코드가 아니라 운영 규칙(scope 분리)으로 막는다.
#
# ## apply 순서 — dev root 먼저, admin root 7개 나중
#
# admin root(K8s namespace/RBAC 등)는 dev root가 만드는 GKE 클러스터·VPC에
# 의존한다. #436에서 겪은 함정을 피하려면 dev root가 항상 먼저 끝나 있어야
# 한다. 같은 job 안의 순차 스텝이라 이 순서가 코드로 보장된다.
#
# ## SA 전환 — 같은 job 안에서 google-github-actions/auth를 여러 번 호출
#
# `google-github-actions/auth@v2`는 한 job 안에서 여러 번 호출해 각기 다른
# SA로 재인증할 수 있다(공식 지원 패턴 — 호출마다 ADC 자격증명 파일과 gcloud
# 활성 계정을 덮어쓴다). 이후의 `gcloud`/`terraform`(google provider, ADC
# 경유)은 모두 그 시점의 최신 자격증명을 읽으므로 캐시 문제가 없다. 재인증
# 자체가 실패하면 해당 step에서 job이 즉시 실패해 뒤 step으로 넘어가지
# 않는다 — 또한 admin root는 K8s RBAC이 `container.admin` 매핑으로만 오므로
# (dev-apply SA는 `container.clusterAdmin`만 보유, K8s object 접근 불가),
# 재인증이 조용히 실패해 dev-apply SA로 admin root apply가 진행되는 경로는
# 없다: 그 즉시 401/403으로 눈에 띄게 실패한다.
#
# ## secret 노출 범위 — step 단위로 좁힌다
#
# admin root 전용 allowlist(#305) TF_VAR는 admin root를 다루는 step의
# env에만 선언한다. dev root를 다루는 step(dev-apply SA, projectIamAdmin
# 보유)의 프로세스 환경에는 이 secret들이 존재하지 않는다(#449 원칙 계승).
#
# ## 부분 실패 시 복구
#
# admin root 7개 중 하나가 실패하면 나머지는 적용되지 않은 채 job이
# 종료되고, `Cleanup plans`(if: always())가 이번 run의 admin plan 객체를
# 전부 지운다 — 즉 "실패 지점부터 이어서" 적용할 수 없고, 원인을 고친 뒤
# 전체(또는 `scope: admin`)를 재dispatch해야 한다. 이미 성공한 root는 다음
# plan에서 `No changes`로 나오므로 재실행 자체는 안전하다(idempotent) —
# 다만 승인을 다시 받아야 한다. 통합 전 `admin-apply.yml`만 재dispatch하면
# 됐던 것과 비교해 재시도 범위가 "admin 7개"에서 "scope에 따라 최대 8개"로
# 늘었을 뿐, 복구 매커니즘 자체는 동일하다(둘 다 root 그룹 단위 전체 재실행).
#
# ## 공개 저장소(#211) / plan 회수
#
# plan/apply 원문(허용 이메일 등 속성값)은 공개 로그·artifact에 노출하지
# 않는다. 출력은 파일로 리다이렉트하고 요약(리소스 헤더/Plan: 라인)만
# STEP_SUMMARY에, plan 바이너리는 private state 버킷
# (`apply-plans/<root>/<run_id>.tfplan`)으로 job 간 전달한다. 회수 절차는
# docs/TERRAFORM_DEV.md "apply workflow 단일 진입점(#451)" 절.
name: apply

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "적용 범위 — all: dev+admin 전체(기본) · dev: dev root만 · admin: admin root 7개만"
        required: false
        default: all
        type: choice
        options:
          - all
          - dev
          - admin

permissions:
  id-token: write # GitHub OIDC → GCP WIF
  contents: read

concurrency:
  group: apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: 1.13.5
  # PLAN_PREFIX는 카탈로그 state.bucket에서 파생한다(각 job의 대조 step이
  # GITHUB_ENV로 내보낸다). 여기에 버킷을 하드코딩하면 카탈로그와 이중 정본이 돼,
  # 카탈로그만 바꾼 이전에서 plan 객체가 옛 버킷으로 향한다.
  DEV_ROOT: terraform/envs/dev
  # #307/#312/#314 admin K8s root 7개, namespace 소유 root 먼저·argocd 마지막
  # (다른 namespace 참조) 순서 유지. gke-team-access(#314)·vault-k8s(#412)는
  # 기존과 동일하게 제외.
  ADMIN_ROOTS: >-
    terraform/admin/autoresearch-k8s
    terraform/admin/airflow-k8s
    terraform/admin/monitoring-k8s
    terraform/admin/elastic-k8s
    terraform/admin/mlflow-k8s
    terraform/admin/argo-rollouts-k8s
    terraform/admin/argocd-k8s
  # 두 root 그룹이 공유하는 변수. 이름이 겹치지 않는다는 불변식은 #449 리뷰에서
  # 실측 확인됨(양방향 충돌 0건) — 어긴 root가 생기면 이 env 블록을 재검토한다.

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # enabled 상태의 고정 revision이 현재 infra commit에서 도달 가능한지
          # plan 전에 검증하려면 전체 이력이 필요하다.
          fetch-depth: 0

      # 인증 전에 카탈로그와 GitHub 변수를 대조한다(상세 근거는 apply job 주석).
      - name: dev 카탈로그와 bootstrap anchor 대조
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          catalog_project="$(ruby scripts/environment_catalog.rb \
            --catalog config/environments/dev/environment.yaml \
            --field gcp.project_id)"
          if [ -z "$CONFIGURED_PROJECT_ID" ] || [ "$CONFIGURED_PROJECT_ID" != "$catalog_project" ]; then
            echo "::error::GCP_PROJECT_ID가 dev 환경 카탈로그와 일치하지 않습니다"
            exit 1
          fi
          catalog_bucket="$(ruby scripts/environment_catalog.rb \
            --catalog config/environments/dev/environment.yaml \
            --field state.bucket)"
          echo "PLAN_PREFIX=gs://${catalog_bucket}/apply-plans" >> "$GITHUB_ENV"
          echo "카탈로그 project_id 일치 확인 / PLAN_PREFIX 파생 완료"

      # #305 방어: admin root를 다루는 dispatch에서만 의미가 있다 — scope=dev
      # 단독 실행이 무관한 admin secret 미설정으로 막히지 않게 한다.
      - name: Guard required allowlist secrets (admin root)
        if: github.event.inputs.scope != 'dev'
        env:
          A1: ${{ secrets.ARGOCD_ADMIN_USER_EMAILS }}
          A2: ${{ secrets.AUTORESEARCH_VIEWER_USER_EMAILS }}
          A3: ${{ secrets.AIRFLOW_INSTALLER_USER_EMAILS }}
          A4: ${{ secrets.MONITORING_PORT_FORWARD_USER_EMAILS }}
          A5: ${{ secrets.MLFLOW_VIEWER_USER_EMAILS }}
        run: |
          missing=""
          [ -z "$A1" ] && missing="$missing ARGOCD_ADMIN_USER_EMAILS"
          [ -z "$A2" ] && missing="$missing AUTORESEARCH_VIEWER_USER_EMAILS"
          [ -z "$A3" ] && missing="$missing AIRFLOW_INSTALLER_USER_EMAILS"
          [ -z "$A4" ] && missing="$missing MONITORING_PORT_FORWARD_USER_EMAILS"
          [ -z "$A5" ] && missing="$missing MLFLOW_VIEWER_USER_EMAILS"
          if [ -n "$missing" ]; then
            echo "::error::allowlist Secret 미설정:$missing — 빈 값으로 apply하면 해당 접근이 삭제됩니다(#305). 설정 후 재실행하세요."
            exit 1
          fi

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # dev root plan — 읽기 전용 CI SA(승인 게이트 이전이므로 최소 권한).
      # scope와 무관하게 항상 인증한다 — 버킷 전체 objectAdmin이 있어 바로
      # 아래 cleanup을 이 SA로 수행할 수 있다(admin-apply SA로 전환하기 전).
      - name: Authenticate as CI SA (dev root plan / cleanup)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.CI_SA_EMAIL }}

      # 승인 거부/미승인 시 apply job의 cleanup이 돌지 않아 orphan plan이
      # 누적된다(#342). plan 바이너리는 민감 속성값을 포함할 수 있으므로 새
      # run 시작 시 이전 잔재를 일괄 정리한다 — concurrency group이 `apply`
      # 하나뿐이라 이 prefix를 쓰는 동시 run은 없다(#448 불변식 자동 충족).
      - name: Cleanup stale plans
        run: gcloud storage rm "$PLAN_PREFIX/**" || true

      - name: Plan dev root
        if: github.event.inputs.scope != 'admin'
        env:
          ROOTS: ${{ env.DEV_ROOT }}
          # dev root 전용 변수(admin root는 선언하지 않음).
          TF_VAR_labels: ${{ vars.TF_LABELS_JSON || '{}' }}
          # MAN은 빈 목록이 정상 상태(기본 접속은 DNS 엔드포인트 #45)라 폴백을 둔다.
          TF_VAR_master_authorized_networks: ${{ vars.MASTER_AUTHORIZED_NETWORKS || '[]' }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::plan $root"
            scripts/terraform-env --environment dev --root "$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; grep -iE "error" "$d/step.txt" | sed -E "$mask" | head -20; exit 1; }
            set +e
            scripts/terraform-env --environment dev --root "$d" plan -input=false -no-color -out=tfplan.bin > "$d/plan.txt" 2>&1
            rc=$?
            set -e
            {
              echo "### $root"
              echo '```text'
              # 'has moved to'/'(moved from ...)'는 #468에서 추가 — 전자는
              # moved-only(주소 이동만, create/destroy 0건), 후자는
              # move+change 병존(이동+동시 속성 변경) 케이스의 주소 이동
              # 사실이 요약에서 누락되지 않게 한다. 두 헤더 모두 리소스
              # 주소만 담고 있어 속성값 비공개 원칙을 깨지 않는다.
              #
              # 'will no longer be managed by Terraform'(removed 블록/
              # forget 헤더) 패턴은 여기(dev root 전용 스텝)에는 두지
              # 않는다 — dev root에는 removed 블록이 없고 #478 최종
              # 설계(config 유지, kms_vault_orphan.tf)도 이 문구를 만들지
              # 않는다. removed 블록은 admin root
              # `monitoring-k8s`/`argo-rollouts-k8s`에 실제로 있으므로,
              # 이 패턴은 아래 "Plan admin roots" 스텝에만 둔다
              # (claude-review 7차 지적 — dev root 스텝은 이 패턴을 실제
              # plan 출력으로 검증할 방법이 없어 회귀를 CI가 못 잡는
              # 사각지대였다).
              grep -E '^[[:space:]]*# .+ (will be|must be|has moved to) |^[[:space:]]*# \(moved from .+\)$|^Plan: [0-9]|^No changes\.' "$d/plan.txt" || echo '(요약 없음)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root plan 실패(rc=$rc):"
              grep -iE "error|denied|forbidden|refused|cannot|failed" "$d/plan.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            gcloud storage cp "$d/tfplan.bin" "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan"
            echo "::endgroup::"
          done

      # admin root plan — cluster read가 필요해 admin-apply SA로 전환한다.
      - name: Authenticate as admin-apply SA (admin root plan)
        if: github.event.inputs.scope != 'dev'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.ADMIN_APPLY_SA_EMAIL }}

      - name: Validate and summarize Agent Orchestration revision input
        if: github.event.inputs.scope != 'dev'
        env:
          AGENT_ORCHESTRATION_DEPLOYMENT_ENABLED: ${{ vars.AGENT_ORCHESTRATION_DEPLOYMENT_ENABLED || 'false' }}
          AGENT_ORCHESTRATION_TARGET_REVISION: ${{ vars.AGENT_ORCHESTRATION_TARGET_REVISION || '' }}
        run: |
          enabled="$AGENT_ORCHESTRATION_DEPLOYMENT_ENABLED"
          target="$AGENT_ORCHESTRATION_TARGET_REVISION"
          echo "### Agent Orchestration GitOps revision" >> "$GITHUB_STEP_SUMMARY"

          case "$enabled" in
            true)
              if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::AGENT_ORCHESTRATION_TARGET_REVISION must be a lowercase 40-character commit SHA when deployment is enabled."
                exit 1
              fi
              if ! git cat-file -e "${target}^{commit}" 2>/dev/null; then
                echo "::error::AGENT_ORCHESTRATION_TARGET_REVISION does not name a commit available in this checkout."
                exit 1
              fi
              if ! git merge-base --is-ancestor "$target" HEAD; then
                echo "::error::AGENT_ORCHESTRATION_TARGET_REVISION is not reachable from the checked-out repository revision."
                exit 1
              fi
              {
                echo "- deployment: enabled"
                echo "- target revision: \`$target\`"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            false)
              {
                echo "- deployment: disabled"
                echo "- target revision: not evaluated while disabled"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::AGENT_ORCHESTRATION_DEPLOYMENT_ENABLED must be true or false."
              exit 1
              ;;
          esac

      - name: Plan admin roots
        if: github.event.inputs.scope != 'dev'
        env:
          ROOTS: ${{ env.ADMIN_ROOTS }}
          # admin root 전용 변수 — allowlist 5종은 삭제 시 접근이 상실되므로
          # '|| []' 폴백을 두지 않는다(#305류 차단, optional만 폴백).
          TF_VAR_argocd_admin_user_emails: ${{ secrets.ARGOCD_ADMIN_USER_EMAILS }}
          TF_VAR_argocd_readonly_user_emails: ${{ secrets.ARGOCD_READONLY_USER_EMAILS || '[]' }}
          TF_VAR_argocd_server_url: ${{ vars.ARGOCD_SERVER_URL || 'https://localhost:8443' }}
          TF_VAR_autoresearch_viewer_user_emails: ${{ secrets.AUTORESEARCH_VIEWER_USER_EMAILS }}
          TF_VAR_installer_user_emails: ${{ secrets.AIRFLOW_INSTALLER_USER_EMAILS }}
          TF_VAR_monitoring_port_forward_user_emails: ${{ secrets.MONITORING_PORT_FORWARD_USER_EMAILS }}
          TF_VAR_mlflow_viewer_user_emails: ${{ secrets.MLFLOW_VIEWER_USER_EMAILS }}
          # argocd-k8s root 전용 non-secret GitHub Variables. 다른 root는 선언하지
          # 않은 TF_VAR를 무시하므로 admin roots 합동 plan에 안전하다.
          TF_VAR_agent_orchestration_target_revision: ${{ vars.AGENT_ORCHESTRATION_TARGET_REVISION || '' }}
          TF_VAR_agent_orchestration_deployment_enabled: ${{ vars.AGENT_ORCHESTRATION_DEPLOYMENT_ENABLED || 'false' }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::plan $root"
            scripts/terraform-env --environment dev --root "$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; grep -iE "error" "$d/step.txt" | sed -E "$mask" | head -20; exit 1; }
            set +e
            scripts/terraform-env --environment dev --root "$d" plan -input=false -no-color -out=tfplan.bin > "$d/plan.txt" 2>&1
            rc=$?
            set -e
            {
              echo "### $root"
              echo '```text'
              # 'has moved to'/'(moved from ...)'는 #468에서 추가 — 전자는
              # moved-only(주소 이동만, create/destroy 0건), 후자는
              # move+change 병존(이동+동시 속성 변경) 케이스의 주소 이동
              # 사실이 요약에서 누락되지 않게 한다. 두 헤더 모두 리소스
              # 주소만 담고 있어 속성값 비공개 원칙을 깨지 않는다.
              #
              # 'will no longer be managed by Terraform'(removed 블록/
              # forget 헤더)은 admin root `monitoring-k8s`/
              # `argo-rollouts-k8s`의 helm_release removed 블록(#307/
              # #312류, destroy=false)이 실제로 만드는 plan 헤더라 이 admin
              # roots 스텝에서 exercise된다 — dev root 전용
              # `terraform-plan.yml`/`terraform-drift.yml`/위 dev root
              # 스텝에는 이 패턴이 없다(#478 작업 중 한때 넣었다가 되돌림,
              # claude-review 7차 지적 — dev root는 removed 블록이 없어
              # 검증 불가능한 코드였다). 이 승인 게이트가 apply
              # Environment reviewer가 실제로 읽는 화면이라 drift 알림보다
              # 영향이 크다.
              grep -E '^[[:space:]]*# .+ (will be|must be|has moved to) |^[[:space:]]*# .+ will no longer be managed by Terraform|^[[:space:]]*# \(moved from .+\)$|^Plan: [0-9]|^No changes\.' "$d/plan.txt" || echo '(요약 없음)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root plan 실패(rc=$rc):"
              grep -iE "error|denied|forbidden|refused|cannot|failed" "$d/plan.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            gcloud storage cp "$d/tfplan.bin" "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan"
            echo "::endgroup::"
          done

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v4

      # 카탈로그가 생성하는 .environment.auto.tfvars.json은 Terraform 우선순위상
      # TF_VAR_ 환경변수보다 강해서, GCP_PROJECT_ID가 카탈로그와 달라도 조용히
      # 덮인다. 그러면 인증 대상 프로젝트와 apply 대상 프로젝트가 갈린 채 권한
      # 오류로만 간접 실패한다. 인증 전에 명시적으로 대조해 fail-closed로 만든다
      # (app·airflow 저장소의 resolve-dev-environment와 같은 계약).
      - name: dev 카탈로그와 bootstrap anchor 대조
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          catalog_project="$(ruby scripts/environment_catalog.rb \
            --catalog config/environments/dev/environment.yaml \
            --field gcp.project_id)"
          if [ -z "$CONFIGURED_PROJECT_ID" ] || [ "$CONFIGURED_PROJECT_ID" != "$catalog_project" ]; then
            echo "::error::GCP_PROJECT_ID가 dev 환경 카탈로그와 일치하지 않습니다"
            exit 1
          fi
          catalog_bucket="$(ruby scripts/environment_catalog.rb \
            --catalog config/environments/dev/environment.yaml \
            --field state.bucket)"
          echo "PLAN_PREFIX=gs://${catalog_bucket}/apply-plans" >> "$GITHUB_ENV"
          echo "카탈로그 project_id 일치 확인 / PLAN_PREFIX 파생 완료"

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # dev root apply — dev-apply SA(프로젝트 최강 자격, #341).
      - name: Authenticate as dev-apply SA (dev root apply)
        if: github.event.inputs.scope != 'admin'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.DEV_APPLY_SA_EMAIL }}

      - name: Apply dev root
        if: github.event.inputs.scope != 'admin'
        env:
          ROOTS: ${{ env.DEV_ROOT }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::apply $root"
            scripts/terraform-env --environment dev --root "$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; exit 1; }
            gcloud storage cp "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan" "$d/tfplan.bin"
            set +e
            scripts/terraform-env --environment dev --root "$d" apply -input=false -no-color tfplan.bin > "$d/apply.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root apply 실패(rc=$rc):"
              grep -iE "error" "$d/apply.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            echo "$root: $(grep -E '^Apply complete' "$d/apply.txt" | sed -E "$mask")" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # admin root apply — admin-apply SA로 전환. dev root apply가 끝난 뒤에만
      # 실행된다(위 "apply 순서" 참고 — needs가 아니라 같은 job 안의 순차 스텝
      # 이라 순서가 코드로 보장된다).
      - name: Authenticate as admin-apply SA (admin root apply)
        if: github.event.inputs.scope != 'dev'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.ADMIN_APPLY_SA_EMAIL }}

      - name: Apply admin roots
        if: github.event.inputs.scope != 'dev'
        env:
          ROOTS: ${{ env.ADMIN_ROOTS }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::apply $root"
            scripts/terraform-env --environment dev --root "$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; exit 1; }
            gcloud storage cp "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan" "$d/tfplan.bin"
            set +e
            scripts/terraform-env --environment dev --root "$d" apply -input=false -no-color tfplan.bin > "$d/apply.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root apply 실패(rc=$rc):"
              grep -iE "error" "$d/apply.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            echo "$root: $(grep -E '^Apply complete' "$d/apply.txt" | sed -E "$mask")" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # cleanup은 scope·이전 step 성공 여부와 무관하게 항상 시도한다. 마지막
      # 활성 자격이 dev-apply/admin-apply SA 중 무엇이었든(또는 아무 apply도
      # 안 했든) 관계없이 지울 수 있도록 버킷 전체 objectAdmin을 가진 CI SA로
      # 재인증한다.
      - name: Authenticate as CI SA (cleanup)
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.CI_SA_EMAIL }}

      - name: Cleanup plans
        if: always()
        run: |
          gcloud storage rm "$PLAN_PREFIX/$(basename "$DEV_ROOT")/${{ github.run_id }}.tfplan" || true
          for d in $ADMIN_ROOTS; do
            gcloud storage rm "$PLAN_PREFIX/$(basename "$d")/${{ github.run_id }}.tfplan" || true
          done
