# #451 apply workflow 단일 진입점. admin-apply(#307/#312)·dev-apply(#341)·
# terraform-apply(#448 재사용 워크플로우) 3개 파일을 이 하나로 통합했다.
# 한 번의 dispatch가 dev root + admin root 7개(총 8개) 전체를 plan하고,
# **승인 1회**로 전체를 apply한다.
#
# ## 이 통합이 만드는 상태 — 명시적으로 수용한 트레이드오프
#
# 이전에는 apply SA 2종의 WIF 가장 조건이 파일 경로(admin-apply.yml@main /
# dev-apply.yml@main)로 갈라져 있어, "최강 자격(dev-apply SA, projectIamAdmin
# 포함)의 사용 경로를 파일 하나로 고정"하는 것이 통제 수단이었다(#341 설계).
# 진입점을 하나로 합치면 **이 파일 하나가 두 SA를 모두 가장**한다. 즉 파일
# 단위 분리는 사라지고, 통제는 다음 3가지로 좁혀진다:
#   1) SA 자체는 계속 분리한다 — dev root는 dev-apply SA, admin root 7개는
#      admin-apply SA. 이 파일 안에서 job마다 SA를 전환한다(아래 "SA 전환"
#      참고).
#   2) `apply.yml@main` workflow_ref만 두 SA를 가장할 수 있다(#451 1단계로
#      선반영된 WI 바인딩).
#   3) apply job은 GitHub Environment `apply` 승인 게이트 뒤에 있다 — **단,
#      이 게이트는 GCP가 아니라 GitHub의 job 스케줄링이 강제한다.** GCP
#      WIF 조건은 workflow_ref만 검사하므로, 승인 전 job이 이 SA를 요청하지
#      않는다는 보증은 이 파일의 코드 리뷰가 전부다(#449 리뷰 문답 참고,
#      docs/TERRAFORM_DEV.md). GCP 측 강제(assertion.environment attribute
#      추가)는 #451 3단계 이후 후보로 남아 있다.
#
# 승인이 하나로 합쳐진 결과, **plan 요약도 최대 8개 root 분량이 한 번에
# 온다.** #306 교훈(요약의 in-place가 접근 변경을 숨길 수 있음)이 이전보다
# 더 중요해진다 — 승인 전 해당 리소스가 보이면 반드시 Actions 로그의 상세
# diff를 확인한다.
#
# ## apply 순서 — dev root 먼저, admin root 7개 나중
#
# admin root(K8s namespace/RBAC 등)는 dev root가 만드는 GKE 클러스터·VPC에
# 의존한다. #436에서 겪은 "신선 클러스터의 ns 참조 순서" 함정과 같은 종류의
# 문제를 피하려면 dev root가 항상 먼저 끝나 있어야 한다. 이 워크플로우는 그
# 순서를 코드로 고정한다(운영자가 매번 순서를 기억할 필요가 없다).
#
# ## SA 전환 — 같은 job 안에서 google-github-actions/auth를 두 번 호출
#
# `google-github-actions/auth@v2`는 한 job 안에서 여러 번 호출해 각기 다른
# SA로 재인증할 수 있다(호출마다 활성 자격증명을 덮어쓴다 — 공식적으로 지원되는
# 패턴). plan job은 CI SA(dev root, 읽기 전용) → admin-apply SA(admin root,
# 클러스터 read 필요) 순으로, apply job은 dev-apply SA → admin-apply SA
# 순으로 전환한다.
#
# ## secret 노출 범위 — step 단위로 좁힌다
#
# admin root 전용 allowlist(#305) TF_VAR는 **admin root를 다루는 step의
# env에만** 선언한다(workflow/job 레벨이 아니라 step 레벨). dev root를
# apply하는 step(dev-apply SA, projectIamAdmin 보유)의 프로세스 환경에는
# 이 secret들이 존재하지 않는다 — #449 리뷰에서 지적된 "secrets: inherit이
# 노출면을 넓힌다"는 우려를 단일 job 구조에서도 같은 원칙(필요한 곳에만)으로
# 이어간다.
#
# ## 공개 저장소(#211) / plan 회수
#
# plan/apply 원문(허용 이메일 등 속성값)은 공개 로그·artifact에 노출하지
# 않는다. 출력은 파일로 리다이렉트하고 요약(리소스 헤더/Plan: 라인)만
# STEP_SUMMARY에, plan 바이너리는 private state 버킷
# (`apply-plans/<root>/<run_id>.tfplan`)으로 job 간 전달한다. 회수 절차는
# docs/TERRAFORM_DEV.md "apply workflow 단일 진입점(#451)" 절.
name: apply

on:
  workflow_dispatch: {}

permissions:
  id-token: write # GitHub OIDC → GCP WIF
  contents: read

concurrency:
  group: apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: 1.13.5
  PLAN_PREFIX: gs://autoresearch-503903-dev-tfstate/apply-plans
  DEV_ROOT: terraform/envs/dev
  # #307/#312/#314 admin K8s root 7개, namespace 소유 root 먼저·argocd 마지막
  # (다른 namespace 참조) 순서 유지. gke-team-access(#314)·vault-k8s(#412)는
  # 기존과 동일하게 제외.
  ADMIN_ROOTS: >-
    terraform/admin/autoresearch-k8s
    terraform/admin/airflow-k8s
    terraform/admin/monitoring-k8s
    terraform/admin/elastic-k8s
    terraform/admin/mlflow-k8s
    terraform/admin/argo-rollouts-k8s
    terraform/admin/argocd-k8s
  # 두 root 그룹이 공유하는 변수. 이름이 겹치지 않는다는 불변식은 #449 리뷰에서
  # 실측 확인됨(양방향 충돌 0건) — 어긴 root가 생기면 이 env 블록을 재검토한다.
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_private_services_cidr: ${{ vars.PRIVATE_SERVICES_CIDR }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #305 방어: 삭제 시 접근 상실되는 admin allowlist Secret이 비면 apply
      # 자체를 막는다. GCP 인증 전에 수행 가능한 순수 bash 체크라 가장 먼저 둔다.
      - name: Guard required allowlist secrets (admin root)
        env:
          A1: ${{ secrets.ARGOCD_ADMIN_USER_EMAILS }}
          A2: ${{ secrets.AUTORESEARCH_VIEWER_USER_EMAILS }}
          A3: ${{ secrets.AIRFLOW_INSTALLER_USER_EMAILS }}
          A4: ${{ secrets.MONITORING_PORT_FORWARD_USER_EMAILS }}
          A5: ${{ secrets.MLFLOW_VIEWER_USER_EMAILS }}
        run: |
          missing=""
          [ -z "$A1" ] && missing="$missing ARGOCD_ADMIN_USER_EMAILS"
          [ -z "$A2" ] && missing="$missing AUTORESEARCH_VIEWER_USER_EMAILS"
          [ -z "$A3" ] && missing="$missing AIRFLOW_INSTALLER_USER_EMAILS"
          [ -z "$A4" ] && missing="$missing MONITORING_PORT_FORWARD_USER_EMAILS"
          [ -z "$A5" ] && missing="$missing MLFLOW_VIEWER_USER_EMAILS"
          if [ -n "$missing" ]; then
            echo "::error::allowlist Secret 미설정:$missing — 빈 값으로 apply하면 해당 접근이 삭제됩니다(#305). 설정 후 재실행하세요."
            exit 1
          fi

      # dev root plan — 읽기 전용 CI SA(승인 게이트 이전이므로 최소 권한).
      - name: Authenticate as CI SA (dev root plan)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.CI_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # 승인 거부/미승인 시 apply job의 cleanup이 돌지 않아 orphan plan이
      # 누적된다(#342). plan 바이너리는 민감 속성값을 포함할 수 있으므로 새
      # run 시작 시 이전 잔재를 일괄 정리한다 — concurrency group이 `apply`
      # 하나뿐이라 이 prefix를 쓰는 동시 run은 없다(#448 불변식 자동 충족).
      # CI SA는 state 버킷 전체에 objectAdmin이 있어 이 삭제가 가능하다.
      - name: Cleanup stale plans
        run: gcloud storage rm "$PLAN_PREFIX/**" 2>/dev/null || true

      - name: Plan dev root
        env:
          ROOTS: ${{ env.DEV_ROOT }}
          # dev root 전용 변수(admin root는 선언하지 않음).
          TF_VAR_dev_subnet_cidr: ${{ vars.DEV_SUBNET_CIDR }}
          TF_VAR_labels: ${{ vars.TF_LABELS_JSON || '{}' }}
          TF_VAR_gke_master_ipv4_cidr: ${{ vars.GKE_MASTER_IPV4_CIDR }}
          TF_VAR_gke_pods_cidr: ${{ vars.GKE_PODS_CIDR }}
          TF_VAR_gke_services_cidr: ${{ vars.GKE_SERVICES_CIDR }}
          # MAN은 빈 목록이 정상 상태(기본 접속은 DNS 엔드포인트 #45)라 폴백을 둔다.
          TF_VAR_master_authorized_networks: ${{ vars.MASTER_AUTHORIZED_NETWORKS || '[]' }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::plan $root"
            terraform -chdir="$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; grep -iE "error" "$d/step.txt" | sed -E "$mask" | head -20; exit 1; }
            set +e
            terraform -chdir="$d" plan -input=false -no-color -out=tfplan.bin > "$d/plan.txt" 2>&1
            rc=$?
            set -e
            {
              echo "### $root"
              echo '```text'
              grep -E '^[[:space:]]*# .+ (will be|must be) |^Plan: [0-9]|^No changes\.' "$d/plan.txt" || echo '(요약 없음)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root plan 실패(rc=$rc):"
              grep -iE "error|denied|forbidden|refused|cannot|failed" "$d/plan.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            gcloud storage cp "$d/tfplan.bin" "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan"
            echo "::endgroup::"
          done

      # admin root plan — cluster read가 필요해 admin-apply SA로 전환한다.
      - name: Authenticate as admin-apply SA (admin root plan)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.ADMIN_APPLY_SA_EMAIL }}

      - name: Plan admin roots
        env:
          ROOTS: ${{ env.ADMIN_ROOTS }}
          # admin root 전용 변수 — allowlist 5종은 삭제 시 접근이 상실되므로
          # '|| []' 폴백을 두지 않는다(#305류 차단, optional만 폴백).
          TF_VAR_argocd_admin_user_emails: ${{ secrets.ARGOCD_ADMIN_USER_EMAILS }}
          TF_VAR_argocd_readonly_user_emails: ${{ secrets.ARGOCD_READONLY_USER_EMAILS || '[]' }}
          TF_VAR_argocd_server_url: ${{ vars.ARGOCD_SERVER_URL || 'https://localhost:8443' }}
          TF_VAR_autoresearch_viewer_user_emails: ${{ secrets.AUTORESEARCH_VIEWER_USER_EMAILS }}
          TF_VAR_installer_user_emails: ${{ secrets.AIRFLOW_INSTALLER_USER_EMAILS }}
          TF_VAR_monitoring_port_forward_user_emails: ${{ secrets.MONITORING_PORT_FORWARD_USER_EMAILS }}
          TF_VAR_mlflow_viewer_user_emails: ${{ secrets.MLFLOW_VIEWER_USER_EMAILS }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::plan $root"
            terraform -chdir="$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; grep -iE "error" "$d/step.txt" | sed -E "$mask" | head -20; exit 1; }
            set +e
            terraform -chdir="$d" plan -input=false -no-color -out=tfplan.bin > "$d/plan.txt" 2>&1
            rc=$?
            set -e
            {
              echo "### $root"
              echo '```text'
              grep -E '^[[:space:]]*# .+ (will be|must be) |^Plan: [0-9]|^No changes\.' "$d/plan.txt" || echo '(요약 없음)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root plan 실패(rc=$rc):"
              grep -iE "error|denied|forbidden|refused|cannot|failed" "$d/plan.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            gcloud storage cp "$d/tfplan.bin" "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan"
            echo "::endgroup::"
          done

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v4

      # dev root apply — dev-apply SA(프로젝트 최강 자격, #341).
      - name: Authenticate as dev-apply SA (dev root apply)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.DEV_APPLY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Apply dev root
        env:
          ROOTS: ${{ env.DEV_ROOT }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::apply $root"
            terraform -chdir="$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; exit 1; }
            gcloud storage cp "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan" "$d/tfplan.bin"
            set +e
            terraform -chdir="$d" apply -input=false -no-color tfplan.bin > "$d/apply.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root apply 실패(rc=$rc):"
              grep -iE "error" "$d/apply.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            echo "$root: $(grep -E '^Apply complete' "$d/apply.txt" | sed -E "$mask")" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # admin root apply — admin-apply SA로 전환. dev root apply가 끝난 뒤에만
      # 실행된다(위 "apply 순서" 참고 — needs가 아니라 같은 job 안의 순차 스텝
      # 이라 순서가 코드로 보장된다).
      - name: Authenticate as admin-apply SA (admin root apply)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ vars.ADMIN_APPLY_SA_EMAIL }}

      - name: Apply admin roots
        env:
          ROOTS: ${{ env.ADMIN_ROOTS }}
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::apply $root"
            terraform -chdir="$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; exit 1; }
            gcloud storage cp "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan" "$d/tfplan.bin"
            set +e
            terraform -chdir="$d" apply -input=false -no-color tfplan.bin > "$d/apply.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root apply 실패(rc=$rc):"
              grep -iE "error" "$d/apply.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            echo "$root: $(grep -E '^Apply complete' "$d/apply.txt" | sed -E "$mask")" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Cleanup plans
        if: always()
        run: |
          gcloud storage rm "$PLAN_PREFIX/$(basename "$DEV_ROOT")/${{ github.run_id }}.tfplan" 2>/dev/null || true
          for d in $ADMIN_ROOTS; do
            gcloud storage rm "$PLAN_PREFIX/$(basename "$d")/${{ github.run_id }}.tfplan" 2>/dev/null || true
          done
