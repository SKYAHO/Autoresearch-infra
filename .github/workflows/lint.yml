name: Lint GitHub Actions Workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check Agent Orchestration deployment contract
        run: ruby scripts/check-agent-orchestration-timeout-contract.rb

      - name: Run Agent Orchestration deployment contract self-test
        run: ruby scripts/test-agent-orchestration-timeout-contract.rb

      - name: Check experiment launcher manifest contract
        run: ruby scripts/check-experiment-launcher-manifest-contract.rb

      - name: Run experiment launcher manifest contract self-test
        run: ruby scripts/test-check-experiment-launcher-manifest-contract.rb

      - name: Check Agent Orchestration PostSync deployment verifier contract
        run: ruby scripts/check-agent-orchestration-deployment-verification.rb

      - name: Run PostSync deployment verifier contract self-test
        run: ruby scripts/test-check-agent-orchestration-deployment-verification.rb

      - name: Check oauth2-proxy email allowlist configuration
        run: scripts/check-oauth-email-allowlist.sh

      - name: Run oauth2-proxy email allowlist self-test
        run: scripts/test-check-oauth-email-allowlist.sh

      # #522 raw_data_prefixes trailing slash·alias 값·staging IAM 참조 회귀 검증.
      - name: Check raw_data_prefixes contract
        run: scripts/check-raw-data-prefixes-contract.sh

      - name: Run raw_data_prefixes contract self-test
        run: scripts/test-check-raw-data-prefixes-contract.sh

      # #478 claude-review 14차 지적: plan 요약 allowlist 정규식이 4곳(apply.yml
      # dev/admin root 스텝 + terraform-plan.yml + terraform-drift.yml)에
      # 복제돼 있어 한 곳만 갱신되면 CI 없이 조용히 어긋난다.
      - name: Check drift/plan summary grep allowlist consistency
        run: scripts/check-drift-summary-grep-consistency.sh

      - name: Run drift/plan summary grep allowlist consistency self-test
        run: scripts/test-check-drift-summary-grep-consistency.sh

      # #485 저장소 첫 .tftest.hcl. CI 실행 경로가 없으면 계약 테스트가 로컬 수동
      # 실행에만 의존해 회귀를 잡지 못한다. mock provider 기반이라 클라우드 자격이
      # 필요 없고 backend도 쓰지 않는다.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Run admin root contract tests
        run: |
          set -euo pipefail
          terraform -chdir=terraform/admin/autoresearch-k8s init -backend=false -input=false
          terraform -chdir=terraform/admin/autoresearch-k8s test

      # 카탈로그 스키마·backend 생성·필드 조회의 회귀를 required check에서 잡는다.
      # 이 테스트가 CI에 없으면 잘못된 카탈로그가 머지된 뒤 apply 시점에야 드러난다.
      - name: Run dev 환경 카탈로그 검증 self-test
        run: ruby scripts/test-environment-catalog.rb

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
