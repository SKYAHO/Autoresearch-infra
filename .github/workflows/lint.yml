name: Lint GitHub Actions Workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check Agent Orchestration deployment contract
        run: ruby scripts/check-agent-orchestration-timeout-contract.rb

      - name: Run Agent Orchestration deployment contract self-test
        run: ruby scripts/test-agent-orchestration-timeout-contract.rb

      - name: Check oauth2-proxy email allowlist configuration
        run: scripts/check-oauth-email-allowlist.sh

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
