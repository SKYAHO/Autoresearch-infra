name: GitHub metadata and branch policy

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  issue-metadata:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({ ...context.repo, issue_number: context.issue.number, assignees: [context.actor] });
            } catch (error) {
              core.warning(`Issue author assignment failed: ${error.message}`);
              const fallback = process.env.DEFAULT_ASSIGNEE;
              if (!fallback) core.setFailed('DEFAULT_GITHUB_ASSIGNEE repository variable is required for assignee fallback.');
              else await github.rest.issues.addAssignees({ ...context.repo, issue_number: context.issue.number, assignees: [fallback] });
            }
        env:
          DEFAULT_ASSIGNEE: ${{ vars.DEFAULT_GITHUB_ASSIGNEE }}

  pr-metadata:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const names = files.map((file) => file.filename);
            const labels = new Set();
            if (names.length > 0 && names.every((name) => name.startsWith('docs/') || name.endsWith('.md'))) labels.add('documentation');
            if (names.some((name) => name.startsWith('terraform/'))) {
              labels.add('terraform');
              labels.add('gcp');
            }
            if (names.some((name) => name.startsWith('.github/workflows/'))) labels.add('ci-cd');
            if (labels.size === 0) labels.add('chore');
            const managed = ['documentation', 'terraform', 'gcp', 'ci-cd', 'chore'];
            for (const label of pr.labels.map((item) => item.name).filter((label) => managed.includes(label) && !labels.has(label))) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: label });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [...labels] });
            try {
              await github.rest.issues.addAssignees({ ...context.repo, issue_number: pr.number, assignees: [pr.user.login] });
            } catch (error) {
              core.warning(`PR author assignment failed: ${error.message}`);
              const fallback = process.env.DEFAULT_ASSIGNEE;
              if (!fallback) core.setFailed('DEFAULT_GITHUB_ASSIGNEE repository variable is required for assignee fallback.');
              else await github.rest.issues.addAssignees({ ...context.repo, issue_number: pr.number, assignees: [fallback] });
            }
        env:
          DEFAULT_ASSIGNEE: ${{ vars.DEFAULT_GITHUB_ASSIGNEE }}
