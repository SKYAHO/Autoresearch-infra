# admin-apply(#307/#312)·dev-apply(#341)의 공통 구현. 두 워크플로우가 각각
# 갖고 있던 plan→승인→apply 파이프라인(요약 게시·이메일 마스킹·plan 바이너리
# GCS 전달·orphan plan 정리)을 여기 한 곳으로 모았다.
#
# 진입점은 계속 `admin-apply.yml`·`dev-apply.yml`이다. GitHub OIDC의
# `workflow_ref` claim은 **호출한 최상위 워크플로우**를 가리키므로(재사용
# 워크플로우 자신은 `job_workflow_ref`), apply SA 2종의 WIF 가장 조건
# (`terraform/envs/dev/github_actions.tf` — admin-apply.yml@main /
# dev-apply.yml@main)은 이 리팩터로 바뀌지 않는다. 즉 "최강 자격의 사용 경로를
# 워크플로우 하나로 고정"한 #341 설계와 admin/dev SA 분리가 그대로 유지된다.
#
# 공개 저장소(#211): plan/apply 원문(허용 이메일 등 속성값)을 공개 로그·artifact에
# 노출하지 않는다. 출력은 파일로 리다이렉트하고 요약(리소스 헤더/Plan: 라인)만
# STEP_SUMMARY에, plan 바이너리는 private state 버킷으로 job 간 전달한다.
#
# 승인 주의(#306 교훈): 요약의 "will be updated in-place"가 접근 변경(GKE
# master_authorized_networks, IAM 계열)을 숨길 수 있다. 승인 전 해당 리소스가
# 보이면 Actions 로그의 상세 diff를 확인한다. plan 회수 경로와 절차는
# docs/TERRAFORM_DEV.md "두 apply workflow의 공용 구현" 절.
#
# 호출부 추가 시 불변식 2가지:
# 1) `plan_prefix` ↔ `concurrency.group`은 1:1이어야 한다. 아래 "Cleanup stale
#    plans"가 자기 prefix 전체를 지우므로, 서로 다른 concurrency group이 같은
#    prefix를 공유하면 승인 대기 중인 다른 run의 plan을 지울 수 있다.
# 2) target별 root의 변수 이름공간이 겹치면 안 된다(아래 TF_VAR 합집합 주석).
name: terraform-apply (reusable)

on:
  workflow_call:
    inputs:
      roots:
        description: "apply 대상 root 디렉터리 목록(공백 구분, 순서가 apply 순서)"
        required: true
        type: string
      plan_prefix:
        description: "plan 바이너리를 job 간 전달할 private GCS prefix"
        required: true
        type: string
      environment:
        description: "승인 게이트로 쓰는 GitHub Environment 이름"
        required: true
        type: string
      plan_service_account:
        description: "plan job이 WIF로 가장할 SA(승인 게이트 이전이므로 가능한 최소 권한)"
        required: true
        type: string
      apply_service_account:
        description: "apply job이 WIF로 가장할 SA"
        required: true
        type: string
      guard_admin_allowlist:
        description: "admin root의 allowlist Secret 비어 있음 가드(#305) 수행 여부. admin root를 포함하는 호출부는 반드시 true."
        required: false
        default: false
        type: boolean
    # secret은 `secrets: inherit`(repo/org 전체 전달) 대신 명시 선언한다 —
    # dev-apply 호출부는 아래를 하나도 넘기지 않아, 최강 SA로 인증되는 dev apply
    # job의 secret 노출면이 리팩터 전(=vars만 사용)과 동일하게 유지된다(#449 리뷰).
    secrets:
      ARGOCD_ADMIN_USER_EMAILS:
        required: false
      ARGOCD_READONLY_USER_EMAILS:
        required: false
      AUTORESEARCH_VIEWER_USER_EMAILS:
        required: false
      AIRFLOW_INSTALLER_USER_EMAILS:
        required: false
      MONITORING_PORT_FORWARD_USER_EMAILS:
        required: false
      MLFLOW_VIEWER_USER_EMAILS:
        required: false

permissions:
  id-token: write # GitHub OIDC → GCP WIF
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: 1.13.5
  # inputs 기반 값은 job env에 둔다(workflow 레벨 env의 컨텍스트 허용 범위에
  # 의존하지 않도록 — 두 job이 각각 선언한다).
  #
  # 두 target의 TF_VAR를 합집합으로 둔다. Terraform은 해당 root가 선언하지 않은
  # TF_VAR_* 환경변수를 조용히 무시하므로(-var와 달리 오류 아님) target별 분기가
  # 필요 없다. **불변식**: 이 안전성은 dev root와 admin root의 변수 이름이 겹치지
  # 않는다는 데 의존한다(#449 리뷰 실측 — 양방향 충돌 0건). 예컨대 admin root가
  # `labels`를 선언하면 default 대신 vars.TF_LABELS_JSON이 조용히 주입돼 plan이
  # 달라진다. 이름이 겹치기 시작하면 target별 분기(입력 또는 *.auto.tfvars 생성)로
  # 전환한다. 변수는 terraform-plan.yml과 동일한 GitHub Vars/Secrets 단일
  # 원천에서만 온다(로컬 tfvars가 default를 덮는 #305류 차단).
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_private_services_cidr: ${{ vars.PRIVATE_SERVICES_CIDR }}
  # dev root(terraform/envs/dev)
  TF_VAR_dev_subnet_cidr: ${{ vars.DEV_SUBNET_CIDR }}
  TF_VAR_labels: ${{ vars.TF_LABELS_JSON || '{}' }}
  TF_VAR_gke_master_ipv4_cidr: ${{ vars.GKE_MASTER_IPV4_CIDR }}
  TF_VAR_gke_pods_cidr: ${{ vars.GKE_PODS_CIDR }}
  TF_VAR_gke_services_cidr: ${{ vars.GKE_SERVICES_CIDR }}
  # MAN은 빈 목록이 정상 상태(기본 접속은 DNS 엔드포인트 #45)라 폴백을 둔다.
  TF_VAR_master_authorized_networks: ${{ vars.MASTER_AUTHORIZED_NETWORKS || '[]' }}
  # admin root(terraform/admin/*) — 삭제 시 접근이 상실되는 allowlist 값은
  # '|| []' 폴백을 두지 않는다. Secret 미설정/빈 값이면 빈 문자열이 되어
  # terraform이 halt한다(#305류 차단). optional만 폴백을 둔다.
  TF_VAR_argocd_admin_user_emails: ${{ secrets.ARGOCD_ADMIN_USER_EMAILS }}
  TF_VAR_argocd_readonly_user_emails: ${{ secrets.ARGOCD_READONLY_USER_EMAILS || '[]' }}
  TF_VAR_argocd_server_url: ${{ vars.ARGOCD_SERVER_URL || 'https://localhost:8443' }}
  TF_VAR_autoresearch_viewer_user_emails: ${{ secrets.AUTORESEARCH_VIEWER_USER_EMAILS }}
  TF_VAR_installer_user_emails: ${{ secrets.AIRFLOW_INSTALLER_USER_EMAILS }}
  TF_VAR_monitoring_port_forward_user_emails: ${{ secrets.MONITORING_PORT_FORWARD_USER_EMAILS }}
  TF_VAR_mlflow_viewer_user_emails: ${{ secrets.MLFLOW_VIEWER_USER_EMAILS }}
  # argocd-k8s root 전용 non-secret GitHub Variables. reusable workflow의 plan/apply
  # job이 같은 env를 상속해 고정 revision plan/apply drift를 막는다. 현재 이 변수명은
  # 다른 admin/dev root에 선언되지 않아 TF_VAR 합집합 계약에 안전하며, 나머지 root는
  # 선언하지 않은 TF_VAR를 무시한다.
  TF_VAR_agent_orchestration_target_revision: ${{ vars.AGENT_ORCHESTRATION_TARGET_REVISION || '' }}
  TF_VAR_agent_orchestration_deployment_enabled: ${{ vars.AGENT_ORCHESTRATION_DEPLOYMENT_ENABLED || 'false' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ROOTS: ${{ inputs.roots }}
      PLAN_PREFIX: ${{ inputs.plan_prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ inputs.plan_service_account }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # #305 방어: 삭제 시 접근 상실되는 allowlist Secret이 비면 apply 자체를 막는다.
      - name: Guard required allowlist secrets
        if: inputs.guard_admin_allowlist
        env:
          A1: ${{ secrets.ARGOCD_ADMIN_USER_EMAILS }}
          A2: ${{ secrets.AUTORESEARCH_VIEWER_USER_EMAILS }}
          A3: ${{ secrets.AIRFLOW_INSTALLER_USER_EMAILS }}
          A4: ${{ secrets.MONITORING_PORT_FORWARD_USER_EMAILS }}
          A5: ${{ secrets.MLFLOW_VIEWER_USER_EMAILS }}
        run: |
          missing=""
          [ -z "$A1" ] && missing="$missing ARGOCD_ADMIN_USER_EMAILS"
          [ -z "$A2" ] && missing="$missing AUTORESEARCH_VIEWER_USER_EMAILS"
          [ -z "$A3" ] && missing="$missing AIRFLOW_INSTALLER_USER_EMAILS"
          [ -z "$A4" ] && missing="$missing MONITORING_PORT_FORWARD_USER_EMAILS"
          [ -z "$A5" ] && missing="$missing MLFLOW_VIEWER_USER_EMAILS"
          if [ -n "$missing" ]; then
            echo "::error::allowlist Secret 미설정:$missing — 빈 값으로 apply하면 해당 접근이 삭제됩니다(#305). 설정 후 재실행하세요."
            exit 1
          fi

      # 승인 거부/미승인 시 apply job의 cleanup이 돌지 않아 orphan plan이
      # 누적된다(#342 리뷰). plan 바이너리는 민감 속성값을 포함할 수 있으므로
      # 새 run 시작 시 이전 잔재를 일괄 정리한다 — 이 안전성은 호출부의
      # concurrency group이 같은 prefix를 쓰는 run의 동시 실행을 막아 준다는
      # 전제 위에 선다(파일 상단 불변식 1). prefix를 공유하면서 group이 다르면
      # 승인 대기 중 run의 plan이 지워지고, 그 run은 승인 후 apply job의
      # `gcloud storage cp`에서 눈에 띄게 실패한다(조용한 통과는 없다).
      - name: Cleanup stale plans
        run: gcloud storage rm "$PLAN_PREFIX/**" 2>/dev/null || true

      - name: Plan roots
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::plan $root"
            terraform -chdir="$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; grep -iE "error" "$d/step.txt" | sed -E "$mask" | head -20; exit 1; }
            set +e
            terraform -chdir="$d" plan -input=false -no-color -out=tfplan.bin > "$d/plan.txt" 2>&1
            rc=$?
            set -e
            {
              echo "### $root"
              echo '```text'
              grep -E '^[[:space:]]*# .+ (will be|must be) |^Plan: [0-9]|^No changes\.' "$d/plan.txt" || echo '(요약 없음)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root plan 실패(rc=$rc):"
              grep -iE "error|denied|forbidden|refused|cannot|failed" "$d/plan.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            gcloud storage cp "$d/tfplan.bin" "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan"
            echo "::endgroup::"
          done

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ROOTS: ${{ inputs.roots }}
      PLAN_PREFIX: ${{ inputs.plan_prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ inputs.apply_service_account }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Apply roots
        run: |
          mask='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
          for d in $ROOTS; do
            root="$(basename "$d")"
            echo "::group::apply $root"
            terraform -chdir="$d" init -input=false -no-color > "$d/step.txt" 2>&1 || { echo "::error::$root init 실패"; exit 1; }
            gcloud storage cp "$PLAN_PREFIX/$root/${{ github.run_id }}.tfplan" "$d/tfplan.bin"
            set +e
            terraform -chdir="$d" apply -input=false -no-color tfplan.bin > "$d/apply.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::$root apply 실패(rc=$rc):"
              grep -iE "error" "$d/apply.txt" | sed -E "$mask" | head -30
              exit "$rc"
            fi
            echo "$root: $(grep -E '^Apply complete' "$d/apply.txt" | sed -E "$mask")" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Cleanup plans
        if: always()
        run: |
          for d in $ROOTS; do
            gcloud storage rm "$PLAN_PREFIX/$(basename "$d")/${{ github.run_id }}.tfplan" || true
          done
