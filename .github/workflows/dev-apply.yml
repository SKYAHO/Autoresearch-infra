# #341 dev root(terraform/envs/dev) gated CI apply.
# 운영자가 수동 트리거 → plan 요약 → GitHub Environment(dev-apply) 승인 → apply.
# dev root apply SA는 projectIamAdmin 포함 최강 자격증명이라 사용 경로를 이
# workflow 하나로 고정한다(설계:
# docs/superpowers/specs/2026-07-24-dev-apply-gated-ci-design.md).
#
# 파이프라인 구현은 admin-apply와 공유한다(`terraform-apply.yml`). 공유 후에도
# 이 파일이 진입점으로 남아야 그 "경로 고정"이 성립한다 — OIDC의 workflow_ref는
# 최상위 호출 워크플로우를 가리키므로 WIF 조건(`dev-apply.yml@main`)과 admin/dev
# SA 분리가 그대로 유지된다.
#
# 변수는 terraform-plan.yml과 동일한 GitHub Vars 단일 원천(#305류 차단). 로컬
# tfvars apply는 break-glass로만 남긴다.
#
# 승인 주의(#306 교훈): 요약의 "will be updated in-place"가 접근 변경(GKE
# master_authorized_networks, IAM 계열)을 숨길 수 있다. 승인 전 해당 리소스가
# 보이면 Actions 로그의 상세 diff를 확인한다.
name: dev-apply

on:
  workflow_dispatch: {}

permissions:
  id-token: write # GitHub OIDC → GCP WIF
  contents: read

concurrency:
  group: dev-apply
  cancel-in-progress: false

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply.yml
    secrets: inherit
    with:
      roots: terraform/envs/dev
      plan_prefix: gs://autoresearch-503903-dev-tfstate/dev-apply-plans
      environment: dev-apply
      # plan job은 승인 게이트 이전에 돌므로 최강 apply SA가 아니라 읽기 전용
      # CI SA로 인증한다(#341 리뷰 반영). plan refresh는 terraform-plan.yml이 같은
      # SA로 매 PR 수행해 read 충분성이 검증돼 있고, state lock/plan 업로드는
      # 이 SA의 state 버킷 objectAdmin으로 가능하다. tfplan.bin은 자격증명을
      # 담지 않으므로 apply job이 다른 SA로 적용해도 무방하다.
      plan_service_account: ${{ vars.CI_SA_EMAIL }}
      apply_service_account: ${{ vars.DEV_APPLY_SA_EMAIL }}
