# #357 oauth2-proxy 사용량 메트릭(44180)을 kube-prometheus-stack이 수집하도록
# 등록한다. `release: kube-prometheus-stack` 라벨은 필수다 — Prometheus의
# podMonitorSelector가 이 라벨을 매칭하며, 없으면 에러 없이 조용히 무시된다
# (#206/#302와 동일 함정). ServiceMonitor 대신 PodMonitor를 쓰는 이유:
# metrics 포트를 ILB Service(10.10.0.3)에 넓히지 않고 파드에서 직접 수집한다.
#
# MLflow 서버 자체(`--expose-prometheus`)가 아닌 이유(#357 폴백 채택):
# 이미지에 prometheus_flask_exporter 부재를 실측 확인 — 추가하려면 앱 저장소
# runtime(pyproject/uv.lock) PR + Cloud Build 재빌드 + digest re-point가 필요해
# dev "사용량 확인" 요구 대비 과대. proxy가 UI/API의 유일한 인입 경로라
# 요청 수·상태코드·지연은 여기서 전부 관측된다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mlflow-oauth-proxy
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow-oauth-proxy
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-oauth-proxy
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
