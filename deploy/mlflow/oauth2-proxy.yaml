# #232 MLflow UI 앞단 인증 게이트(OAuth2-proxy). Google 로그인 + authenticated-emails
# 파일 계약. 현재 --email-domain=*가 파일 판정을 덮어써 목록만으로 제한되지 않는다(#488).
# 사용자는 mlflow가 아니라 이 proxy(4180)로
# port-forward 한다. proxy가 인증 후 mlflow(5000)로 프록시한다.
# client-id/secret·cookie-secret·허용 이메일 목록은 공개 저장소에 두지 않고
# operator 주입 Secret `mlflow-oauth`에서 받는다(mlflow-k8s README 참조).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-oauth-proxy
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow-oauth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-oauth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-oauth-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=google
            - --http-address=0.0.0.0:4180
            # 인증 후 프록시 대상 = 내부 MLflow Service(내부 전용 유지).
            - --upstream=http://mlflow.mlflow:5000
            # 접속(port-forward 또는 Bastion 터널) 모두 브라우저는 localhost:4180.
            # 터널은 DNS:4180으로 연결하고 브라우저 Host는 localhost라 redirect 불변
            # (콘솔 재등록 불필요). Google OAuth callback.
            - --redirect-url=http://localhost:4180/oauth2/callback
            # 주의: v7.7.1에서는 --email-domain=*가 파일 판정을 덮어쓴다(#488).
            # authenticated-emails 파일만으로 접근 제한이 되지 않으므로 런타임
            # 수정 전까지 이 설정을 allowlist로 간주하지 않는다.
            - --email-domain=*
            - --authenticated-emails-file=/etc/oauth2-proxy/authenticated-emails
            # Airflow식 sign-in 페이지를 유지(바로 리다이렉트 안 함).
            - --skip-provider-button=false
            # port-forward는 http localhost라 secure 쿠키 불가.
            - --cookie-secure=false
            # #357 사용량 메트릭 노출(요청 수·상태코드·지연). 4180과 분리된
            # 포트라 ILB Service에는 노출되지 않고 PodMonitor가 직접 수집한다.
            - --metrics-address=0.0.0.0:44180
          env:
            # client-id는 공개값이지만 secret/emails와 함께 관리해 매니페스트를
            # 환경 비종속으로 유지한다. 값은 operator 주입 Secret에서만.
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-oauth
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlflow-oauth
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlflow-oauth
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
            - name: metrics
              containerPort: 44180
          volumeMounts:
            - name: emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: emails
          secret:
            secretName: mlflow-oauth
            items:
              - key: authenticated-emails
                path: authenticated-emails
---
# 접근: (1) Bastion(#47) 터널 → 내부 LB VIP(10.10.0.2 =
# mlflow.dev.autoresearch.internal), (2) kubectl port-forward. 둘 다 브라우저는
# localhost:4180로 접속 → oauth2-proxy 인증. internal LB는 VPC 전용(외부 노출 없음).
# loadBalancerIP는 terraform output mlflow_ilb_ip(#244). Airflow #48과 동일 패턴.
# 값을 여기 리터럴로 두면 프로젝트/subnet이 바뀔 때 따라오지 않는다 — 실제로 #404
# 프로젝트 이전에서 구 예약 IP(10.10.0.22)가 남아 DNS(신 예약 IP)와 갈렸다(#425).
# 예약 IP가 재생성되면 반드시 output 값으로 다시 맞춘다.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-oauth-proxy
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow-oauth-proxy
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  loadBalancerIP: "10.10.0.2"
  selector:
    app.kubernetes.io/name: mlflow-oauth-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
