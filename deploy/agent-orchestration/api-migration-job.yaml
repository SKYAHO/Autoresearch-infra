# Experiment API v0 Alembic migration은 API rollout 전에 한 번만 실행한다. 기존 API
# KSA의 DB bootstrap 경로만 사용하며 OAuth PVC와 API·Runner 요청 토큰은 mount하지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-orchestration-api-migration
  namespace: autoresearch
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    # 성공·실패 Job을 다음 sync 전까지 남겨 상태와 log를 확인한다. 다음 PreSync 전에
    # 같은 이름의 이전 Job은 삭제해 migration이 다시 실행될 수 있게 한다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: agent-orchestration-api-migration
    app.kubernetes.io/part-of: agent-orchestration
    app.kubernetes.io/component: api
spec:
  backoffLimit: 1
  # 이 예산은 스케줄링 + 새 digest image pull + Secret Manager를 호출하는 initContainer
  # + 미적용 revision 전체 적용을 모두 포함한다. #525 첫 실행은 노드에 캐시되지 않은
  # 이미지를 받아 revision 3개를 적용하므로, 실측이 없는 상태에서 180초는 여유가
  # 없다고 판단해 300초로 올렸다. DeadlineExceeded는 자동 재시도되지 않고 rollout
  # 전체를 막으므로 부족한 쪽보다 넉넉한 쪽의 비용이 작다.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        # API egress policy만 적용해 DB, DNS, Workload Identity와 Private Google
        # APIs 외에는 연결할 수 없다.
        app.kubernetes.io/name: agent-orchestration-api-migration
        app.kubernetes.io/part-of: agent-orchestration
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: agent-orchestration-api
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-db
          image: asia-northeast3-docker.pkg.dev/autoresearch-505505/autoresearch-dev-docker/autoresearch-agent-orchestration-api@sha256:9622da559b3db1c6d6b2b8360c281cb73b3987bdcf951b4599d1590aaf666c41
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - applications.experiment_platform.shared.bootstrap_secrets
          env:
            - name: ORCH_DB_PASSWORD_SECRET_ID
              value: projects/autoresearch-505505/secrets/autoresearch-dev-agent-orchestration-db-password/versions/latest
            - name: ORCH_DB_HOST
              value: 192.168.0.3
            - name: ORCH_DB_NAME
              value: agent_orchestration
            - name: ORCH_DB_USER
              value: agent_orchestration_app
            - name: ORCH_RUNTIME_DIR
              value: /runtime
          volumeMounts:
            - name: db-runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: asia-northeast3-docker.pkg.dev/autoresearch-505505/autoresearch-dev-docker/autoresearch-agent-orchestration-api@sha256:9622da559b3db1c6d6b2b8360c281cb73b3987bdcf951b4599d1590aaf666c41
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os
              from pathlib import Path

              entries = [
                  line.split("=", 1)[1]
                  for line in Path("/runtime/db.env").read_text(encoding="utf-8").splitlines()
                  if line.startswith("ORCH_DATABASE_URL=")
              ]
              if len(entries) != 1:
                  raise SystemExit("Expected exactly one ORCH_DATABASE_URL runtime entry")
              os.environ["ORCH_DATABASE_URL"] = entries[0]
              os.execvp(
                  "alembic",
                  ["alembic", "-c", "applications/experiment_platform/alembic.ini", "upgrade", "head"],
              )
          env:
            - name: ORCH_RUNTIME_DIR
              value: /runtime
          volumeMounts:
            - name: db-runtime
              mountPath: /runtime
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-runtime
          emptyDir:
            medium: Memory
