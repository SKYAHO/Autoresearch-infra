# #551 Phase 1 launcher는 1분마다 DB에서 봉인 좌표가 완성된 Experiment를 선점하고,
# 고정 manifest의 branch-bootstrap Job을 생성한 뒤 종료한다. GitHub ref 생성은 executor
# Job의 책임이며 launcher는 GitHub 공개 egress나 branch-writer private key를 갖지 않는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-orchestration-launcher
  namespace: autoresearch
  labels:
    app.kubernetes.io/name: agent-orchestration-launcher
    app.kubernetes.io/part-of: agent-orchestration
    app.kubernetes.io/component: launcher
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-orchestration-launcher
            app.kubernetes.io/part-of: agent-orchestration
            app.kubernetes.io/component: launcher
        spec:
          serviceAccountName: agent-orchestration-launcher
          # launcher만 Kubernetes Jobs create/get/list를 호출하므로 in-cluster token이
          # 필요하다. executor Job은 애플리케이션 고정 manifest에서 false로 강제한다.
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # DB bootstrap은 launcher image가 아니라 API image로 실행한다.
            # `agent_orchestration/bootstrap_secrets.py`는 애플리케이션 저장소
            # 최상위 모듈인데 `launcher.Dockerfile`은 `__init__.py`, `launcher/`,
            # `app/`, `github_app.py`, `github_refs.py`만 COPY하므로 launcher
            # image에 들어 있지 않다. launcher image로 실행하면 initContainer가
            # ModuleNotFoundError로 죽고 backoffLimit 0이라 1분마다 실패 Job만
            # 쌓인다. api-migration-job.yaml이 쓰는 것과 같은 패턴이다.
            #
            # bootstrap API image는 DB bootstrap 모듈을 포함하는 검증된 digest에
            # 고정한다. launcher image가 자체 bootstrap을 갖게 하려면 Dockerfile에
            # 해당 모듈을 추가하는 애플리케이션 변경이 선행돼야 하며, 그 전까지는
            # API image 참조가 유일하게 동작하는 구성이다.
            - name: bootstrap-db
              image: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-agent-orchestration-api@sha256:391976b3cf9e2379e60040d8e4944af0a9afc6299d384a4d432312efc31f06b3
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - agent_orchestration.bootstrap_secrets
              env:
                - name: ORCH_DB_PASSWORD_SECRET_ID
                  value: projects/autoresearch-503903/secrets/autoresearch-dev-agent-orchestration-db-password/versions/latest
                - name: ORCH_DB_HOST
                  value: 192.168.0.3
                - name: ORCH_DB_NAME
                  value: agent_orchestration
                - name: ORCH_DB_USER
                  value: agent_orchestration_app
                - name: ORCH_RUNTIME_DIR
                  value: /runtime
              volumeMounts:
                - name: db-runtime
                  mountPath: /runtime
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: launcher
              image: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-agent-orchestration-launcher@sha256:a3b1ac27e541aabc186fe13f98e0c8f423184959920d8918cacce7b24a3fb8f1
              imagePullPolicy: IfNotPresent
              # bootstrap initContainer가 권한 제한 memory volume에 쓴 DB URL만 현재
              # process 환경으로 옮긴다. Secret 원문은 manifest·Kubernetes Secret·로그에
              # 남지 않으며 exec 뒤 launcher process만 값을 가진다.
              command:
                - python
                - -c
                - |
                  import os
                  from pathlib import Path

                  entries = [
                      line.split("=", 1)[1]
                      for line in Path("/runtime/db.env").read_text(encoding="utf-8").splitlines()
                      if line.startswith("ORCH_DATABASE_URL=")
                  ]
                  if len(entries) != 1:
                      raise SystemExit("Expected exactly one ORCH_DATABASE_URL runtime entry")
                  os.environ["ORCH_DATABASE_URL"] = entries[0]
                  os.execvp(
                      "python",
                      ["python", "-m", "agent_orchestration.launcher.main"],
                  )
              env:
                - name: ORCH_JOB_NAMESPACE
                  value: autoresearch-experiments
                - name: ORCH_EXECUTOR_IMAGE
                  value: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-agent-orchestration-executor@sha256:c53561f592b0f958ba80182fbc8bd6b8e319e6ca4b1bd1a734e2c4476ef6e1b9
                # (#604) Stage 1 측정 산출물은 executor Pod 종료 뒤에도 이 root 아래
                # experiments/{issue_number}/{experiment_id}/에 남아야 한다. Job GSA의
                # objectCreator와 executor results_store의 if_generation_match=0
                # precondition이 기존 객체 교체를 막아 결과를 write-once로 유지한다.
                - name: ORCH_EXPERIMENT_RESULTS_ROOT
                  value: gs://autoresearch-503903-autoresearch-dev-experiment-results
                - name: ORCH_EXECUTOR_SERVICE_ACCOUNT
                  value: experiment-job
                - name: ORCH_EXECUTOR_NODE_POOL
                  value: batch-od
                - name: ORCH_TRAINING_DATASET_URI
                  value: gs://autoresearch-503903-autoresearch-dev-experiment-results/training-snapshots/by-hash/d3d273e66324042cd8e547068c194231cf1812d53cb68236edba56b067055293/
                - name: ORCH_TRAINING_TIMEOUT_SEC
                  value: "1800"
                - name: ORCH_TRAINING_DOWNLOAD_TIMEOUT_SEC
                  value: "600"
                - name: ORCH_UV_SYNC_TIMEOUT_SEC
                  value: "900"
                # launcher가 executor Job의 학습 container에 그대로 넘길 MLflow 좌표.
                # 값이 비어 있으면 launcher는 아무것도 붙이지 않고, 학습은 Pod 로컬
                # file store로 떨어져 run이 Pod과 함께 사라진다(= 현행 동작).
                # 전달 코드는 애플리케이션 저장소 `launcher/jobs.py`에 있다.
                - name: ORCH_MLFLOW_TRACKING_URI
                  value: http://mlflow.mlflow.svc.cluster.local:5000
                - name: ORCH_GITHUB_APP_SECRET_NAME
                  value: autoresearch-experiment-branch-writer-app
                - name: ORCH_GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: autoresearch-experiment-branch-writer-app
                      key: app-id
                - name: ORCH_GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: autoresearch-experiment-branch-writer-app
                      key: installation-id
                - name: ORCH_GITHUB_REPOSITORY
                  value: SKYAHO/Autoresearch
                - name: ORCH_MAX_CONCURRENT_EXPERIMENTS
                  value: "2"
                # (#562) Phase 2 executor 좌표. launcher/config.py의
                # from_environment()가 아래 다섯 개를 모두 _required_environment로
                # 읽으므로, 하나라도 빠지면 launcher가 기동 즉시 죽고 실험이 0건이
                # 된다.
                #
                # candidate-finalizer가 candidate SHA를 보고할 in-cluster API다.
                # 같은 클러스터의 ClusterIP Service이며 experiment namespace의
                # executor egress 정책이 이 목적지만 따로 열어 둔다.
                - name: ORCH_EXECUTOR_API_URL
                  value: http://agent-orchestration-api.autoresearch.svc.cluster.local:8000
                # 아래 두 Secret 이름은 terraform/admin/autoresearch-k8s의
                # experiment_executor_api_token_secret_name·
                # experiment_codex_home_secret_name과 정확히 같아야 한다.
                # 어드미션 계약이 volume의 secretName을 그 값으로 고정하므로
                # 불일치하면 모든 executor Job이 거부된다.
                - name: ORCH_EXECUTOR_API_TOKEN_SECRET_NAME
                  value: autoresearch-experiment-executor-api-token
                - name: ORCH_CODEX_HOME_SECRET_NAME
                  value: autoresearch-experiment-codex-auth
                # workspace는 medium=Memory가 아닌 노드 ephemeral storage를
                # 소비한다. 어드미션 계약이 이 문자열과 정확히 일치하는지 검사하므로
                # 8Gi와 8192Mi는 다른 값으로 취급된다.
                - name: ORCH_EXECUTOR_WORKSPACE_SIZE_LIMIT
                  value: 8Gi
                # 두 시간 값에는 제약이 두 겹이다.
                #   ORCH_CODEX_TIMEOUT_SEC < ORCH_ACTIVE_DEADLINE_SEC
                #     → 어기면 launcher가 기동 시 LauncherConfigError로 죽는다.
                #   ORCH_ACTIVE_DEADLINE_SEC <= 60000
                #     → 어기면 launcher는 뜨지만 어드미션이 Job을 거부하고 실패가
                #       launcher 로그에만 남아, 조용히 아무 Job도 만들어지지 않는다.
                # Stage 1은 8-container 실행 뒤 2조건×3 seed 채점을 수행하므로,
                # 60000초 Job budget과 그보다 작은 6000초 Codex 상한을 사용한다.
                # Codex 상한은 8개 container 각각이 아니라 codex-worker의 단일
                # `codex exec` subprocess 한 번에 적용된다. 학습 timeout 1800초는
                # 조건별 seed 하나의 train-model 실행, 같은 값이 측정 단계의
                # evaluate-model seed 하나에도 적용된다(전체 Job/단계 합계가 아님).
                - name: ORCH_ACTIVE_DEADLINE_SEC
                  value: "60000"
                - name: ORCH_CODEX_TIMEOUT_SEC
                  value: "6000"
                # (#579) #582 실패 원인을 수집하는 단일 smoke 동안 완료 Job을
                # 1시간 보존한다. EVALUATING 완주 증거 수집 뒤 30으로 회수한다.
                - name: ORCH_TTL_AFTER_FINISHED_SEC
                  value: "3600"
              volumeMounts:
                - name: db-runtime
                  mountPath: /runtime
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: db-runtime
              emptyDir:
                medium: Memory
---
# launcher는 Cloud SQL·Secret Manager·DNS와 Kubernetes API만 호출한다. 공개 GitHub
# egress는 생성된 branch-bootstrap Pod에만 별도 허용되며 launcher에는 열지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-orchestration-launcher
  namespace: autoresearch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-orchestration-launcher
      app.kubernetes.io/part-of: agent-orchestration
      app.kubernetes.io/component: launcher
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # dev Terraform var.private_services_cidr와 반드시 일치한다.
            cidr: 192.168.0.0/20
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            # dev Terraform var.gke_services_cidr와 반드시 일치한다.
            cidr: 172.16.128.0/24
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            # Secret Manager private.googleapis.com 고정 VIP.
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
    - to:
        # Calico의 Service DNAT 전·후 평가 경로를 모두 허용하되 Kubernetes API
        # Service 한 개와 control plane CIDR로만 제한한다.
        - ipBlock:
            cidr: 172.16.128.1/32
        - ipBlock:
            cidr: 172.16.0.0/28
      ports:
        - protocol: TCP
          port: 443
