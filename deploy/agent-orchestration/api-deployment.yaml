# Agent Orchestration API의 최초 배포 manifest다. API container와 DB bootstrap은
# 같은 immutable digest를 사용한다. 이후 promotion·rollback도 두 참조를 같은
# manifest commit에서 함께 갱신하며 mutable tag는 사용하지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestration-api
  namespace: autoresearch
  labels:
    app.kubernetes.io/name: agent-orchestration-api
    app.kubernetes.io/part-of: agent-orchestration
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-orchestration-api
  template:
    metadata:
      # ConfigMap 값과 함께 바뀌어 API·Runner Pod를 같은 timeout으로 재기동한다.
      annotations:
        autoresearch.io/codex-runner-timeout-sec: "120"
      labels:
        app.kubernetes.io/name: agent-orchestration-api
        app.kubernetes.io/part-of: agent-orchestration
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: agent-orchestration-api
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-db
          image: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-agent-orchestration-api@sha256:e8886396c00a6c919cb28d49c7ad4de836b0de07a685da5db7a166384e72f066
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - agent_orchestration.bootstrap_secrets
          env:
            - name: ORCH_DB_PASSWORD_SECRET_ID
              value: projects/autoresearch-503903/secrets/autoresearch-dev-agent-orchestration-db-password/versions/latest
            - name: ORCH_DB_HOST
              value: 192.168.0.3
            - name: ORCH_DB_NAME
              value: agent_orchestration
            - name: ORCH_DB_USER
              value: agent_orchestration_app
            - name: ORCH_RUNTIME_DIR
              value: /runtime
          volumeMounts:
            - name: db-runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-agent-orchestration-api@sha256:e8886396c00a6c919cb28d49c7ad4de836b0de07a685da5db7a166384e72f066
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLM_BACKEND
              value: codex_runner
            - name: CODEX_RUNNER_URL
              value: http://agent-orchestration-runner.autoresearch.svc.cluster.local:8080
            - name: CODEX_RUNNER_TIMEOUT_SEC
              valueFrom:
                configMapKeyRef:
                  name: agent-orchestration-runner-timeout
                  key: CODEX_RUNNER_TIMEOUT_SEC
            - name: ORCH_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  # API와 Runner 사이에서만 쓰는 별도 내부 인증 토큰이다. 이
                  # 토큰은 OAuth·DB 시크릿과 분리되며 Secret Manager 접근권한을
                  # 추가로 부여하지 않는다.
                  name: agent-orchestration-runner-token
                  key: ORCH_RUNNER_TOKEN
            - name: ORCH_RUNTIME_DIR
              value: /runtime
            - name: ORCH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  # 운영자가 runbook 절차로 주입하는 공유 요청 토큰이다. DB/OAuth
                  # 시크릿과 달리 GSA accessor를 부여하지 않는다.
                  name: agent-orchestration-api-token
                  key: ORCH_API_TOKEN
            - name: ORCH_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  # 운영자가 runbook 절차로 주입하는 issues:write 전용 fine-grained
                  # PAT다. API·Runner 요청 토큰과 분리하며 GSA accessor를 부여하지
                  # 않는다. 이 Secret이 없으면 Pod가 startup에서 실패한다.
                  name: agent-orchestration-github-token
                  key: ORCH_GITHUB_TOKEN
            # (#575) Phase 2 candidate 보고의 수신 측 인증 값이다. 발신 측
            # candidate-finalizer는 `autoresearch-experiments` namespace의 같은
            # 이름·key Secret을 파일로 mount한다. Kubernetes Secret은
            # namespace-scoped라 한 객체를 두 Pod가 공유할 수 없으므로, 같은
            # payload를 가진 사본이 두 namespace에 각각 하나씩 있어야 한다.
            #
            # 두 사본이 어긋나면 candidate 보고가 401로 실패한다. 회전은 실행 중
            # Experiment가 없는 시점에 양쪽을 함께 갱신하고 API를 재시작한다.
            # 값이나 hash를 로그·PR에 출력해 동일성을 증명하지 않는다 — 새 API의
            # Ready 상태와 인증된 candidate smoke 결과로 검증한다.
            #
            # envFrom을 쓰지 않는 이유는 Secret에 key가 추가될 때 그것까지 API
            # 환경으로 새어 들어가기 때문이다. 단일 key만 참조한다.
            - name: ORCH_EXECUTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autoresearch-experiment-executor-api-token
                  key: token
            # gh issue create가 연 이슈의 URL을 이 값과 대조해 다른 저장소에 열린
            # 이슈를 거부한다. 정확히 owner/repo 형식이어야 한다.
            - name: ORCH_GITHUB_REPOSITORY
              value: SKYAHO/Autoresearch
            # 발행되는 이슈 본문에 문자열로 박히는 좌표다. 기간은 발행 시점에 서버가
            # 계산해 붙이므로 날짜를 넣지 않는다.
            - name: ORCH_EXPERIMENT_DATASET_SOURCE
              value: feast://feast_offline_store/training_entity
            - name: ORCH_EXPERIMENT_TRAINING_CONFIG_REF
              value: src/pipeline/config.yaml@main
            # #539 baseline-reader GitHub App. 이슈 발행 **전에** heads/dev SHA를
            # 읽어 experiments.base_dev_sha에 봉인하는 데만 쓴다. 이 App은 선택된
            # 한 저장소의 Contents read만 가지며, 브랜치를 만드는 branch-writer App
            # (Contents write)과 별개의 App·Secret이다.
            #
            # App ID와 installation ID는 비밀이 아니지만 App 생성 전에는 값을 알 수
            # 없어 manifest에 리터럴로 박을 수 없다. #533 actions-runner와 같은
            # 패턴으로 private key와 같은 Secret에 함께 두고 운영자가 runbook 절차로
            # 주입한다. Secret이 없으면 Pod가 뜨지 않는다(fail-closed).
            - name: ORCH_BASELINE_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: agent-orchestration-baseline-reader-app
                  key: app-id
            - name: ORCH_BASELINE_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: agent-orchestration-baseline-reader-app
                  key: installation-id
            # private key는 환경 변수가 아니라 파일로만 전달한다. 환경 변수는 하위
            # 프로세스(gh CLI 등)로 상속되고 crash dump·프로세스 목록에 노출될 수
            # 있어 PEM을 담기에 부적절하다.
            - name: ORCH_BASELINE_GITHUB_APP_PRIVATE_KEY_PATH
              value: /var/run/secrets/baseline-reader/private-key.pem
          volumeMounts:
            - name: db-runtime
              mountPath: /runtime
              readOnly: true
            # gh CLI가 호출마다 HOME·GH_CONFIG_DIR·TMPDIR용과 issue body 파일용
            # 임시 디렉터리를 만든다. readOnlyRootFilesystem이라 writable /tmp가
            # 없으면 발행이 실패한다.
            - name: tmp
              mountPath: /tmp
            # #539 baseline-reader private key. API 컨테이너만 마운트하며
            # initContainer(DB bootstrap)에는 넣지 않는다.
            - name: baseline-reader-app
              mountPath: /var/run/secrets/baseline-reader
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-runtime
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # #539 baseline-reader App private key. 값(PEM)은 Terraform이 관리하지 않고
        # 운영자가 runbook 절차로 주입한다. defaultMode는 8진수 0440(owner/group
        # 읽기)이다 — Secret 파일 소유자는 root:fsGroup이라 0400으로 두면 fsGroup
        # 10001로 도는 API 프로세스가 읽지 못한다.
        - name: baseline-reader-app
          secret:
            secretName: agent-orchestration-baseline-reader-app
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
