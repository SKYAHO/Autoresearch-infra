# #533 ArgoCD가 이 values로 gha-runner-scale-set subchart를 배포한다.
# subchart이므로 모든 값은 gha-runner-scale-set: 아래로 중첩된다.
gha-runner-scale-set:
  # 이 저장소(PoC 워크플로우가 사는 곳) 범위로만 러너를 등록한다. org 전체 범위는
  # 범위 밖(#533 설계 문서 "범위 밖" 참고).
  githubConfigUrl: "https://github.com/SKYAHO/Autoresearch-infra"

  # 값은 Terraform이 관리하지 않는 기존 K8s Secret을 참조한다(Variation C, 사전
  # 정의 Secret). 운영자가 GitHub App 자격 증명으로 만든다 — 런북:
  # docs/runbooks/2026-08-05-actions-runner-github-app-secret.md.
  githubConfigSecret: actions-runner-github-app

  # terraform/admin/actions-runner-k8s ResourceQuota(pods=maxRunners+2, 컨트롤러/
  # 리스너 상주 Pod 몫 포함)와 짝을 이룬다. 값을 바꿀 때는 그 root의
  # actions_runner_max_pods도 함께 바꾼다.
  maxRunners: 4
  minRunners: 0

  # 워크플로우의 `runs-on: actions-runner-poc`와 일치해야 한다.
  runnerScaleSetName: "actions-runner-poc"

  # ARC 컨트롤러가 watchSingleNamespace로 설치돼 controller 자동 탐지가 동작하지
  # 않으므로 명시적으로 지정한다(chart 안내 주석).
  controllerServiceAccount:
    namespace: actions-runner
    name: actions-runner-controller

  # ephemeral runner Pod 전용 신원(#533 리뷰) — Terraform이 만든 automount=false
  # KSA를 그대로 쓴다. AutoscalingListener Pod는 이 값의 영향을 받지 않는다 —
  # chart가 자체 SA(listener RBAC 포함)를 자동 생성한다. GCP API를 직접
  # 호출하지 않으므로 WI annotation은 없다.
  template:
    spec:
      serviceAccountName: actions-runner-runner
