gha-runner-scale-set:
  # PoC(deploy/actions-runner-scale-set)와 달리 앱 저장소를 가리킨다 —
  # feast-apply.yml이 SKYAHO/Autoresearch에 있으므로 그 저장소 job을 받으려면
  # 그 저장소 스코프로 등록해야 한다(#541). GitHub App 설치 범위도 그 저장소로
  # 확장돼 있어야 한다(런북 참고).
  githubConfigUrl: "https://github.com/SKYAHO/Autoresearch"
  githubConfigSecret: actions-runner-github-app
  maxRunners: 2
  minRunners: 0
  runnerScaleSetName: "feast-apply-prod"
  controllerServiceAccount:
    namespace: actions-runner
    name: actions-runner-controller
  template:
    spec:
      serviceAccountName: feast-apply-prod-runner
