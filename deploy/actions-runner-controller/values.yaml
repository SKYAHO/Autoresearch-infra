# #533 ArgoCD가 이 values로 gha-runner-scale-set-controller subchart를 배포한다.
# subchart이므로 모든 값은 gha-runner-scale-set-controller: 아래로 중첩된다.
gha-runner-scale-set-controller:
  # 이 컨트롤러가 관리하는 namespace를 actions-runner 하나로 제한한다. 이 값을
  # 설정하면 chart가 cluster-scoped ClusterRole 대신 namespace 범위 Role만
  # 만들어 RBAC를 이 namespace로 좁힌다(chart 실측 확인).
  flags:
    watchSingleNamespace: actions-runner

  # Terraform(terraform/admin/actions-runner-k8s)이 만든 Workload Identity KSA를
  # 그대로 쓴다 — chart가 만드는 기본 SA에는 WI annotation이 없다.
  serviceAccount:
    create: false
    name: actions-runner-controller
