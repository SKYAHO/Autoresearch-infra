batch-spot 현행화·CHANGE_HISTORY 기록 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-30T05:12:47Z", "summary_ko": ["GCP 프로젝트 이전 작업(#404)에 따른 전체 인프라 재구축 히스토리와 주요 결정 사항을 변경 이력 문서에 기록했습니다.", "실제 적용된 배치용 스팟 노드풀 사양(n2-standard-2 및 최대 8개)을 인프라 요약 문서에 반영했습니다.", "문서와 실제 GCP 인프라 환경 간의 정보 정합성을 완성하여 팀원들의 운영 혼선을 예방하도록 개선했습니다."], "report_url": "pr/429/"}, {"number": 430, "title": "fix: Filebeat 평문 로그 JSON 오류 마커 제거", "author": "hyeongyu-data", "merged_at": "2026-07-30T04:51:12Z", "summary_ko": ["Filebeat ndjson 파서의 add_error_key 옵션을 false로 변경하였습니다.", "비JSON 평문 로그 수집 시 불필요하게 추가되던 error.type=json 오류 마커를 제거하였습니다.", "Kibana 운영 런북 문서의 평문 로그 폴백 관련 설명을 최신 동작에 맞게 업데이트하였습니다."], "report_url": "pr/430/"}, {"number": 428, "title": "fix: airflow 배치 KSA를 airflow-k8s root로 IaC 편입 (#427)", "author": "hyeongyu-data", "merged_at": "2026-07-30T03:27:15Z", "summary_ko": ["Airflow 배치 작업용 서비스 계정(KSA)을 테라폼 코드(airflow-k8s 루트)로 정식 편입했습니다.", "수동 kubectl 명령에 의존하던 환경 재구축 시의 계정 누락 위험을 근본적으로 차단했습니다.", "기존 응급 생성 리소스를 테라폼 상태로 입양(import)하여 기존 배치 실행 영향 없이 안전하게 반영했습니다."], "report_url": "pr/428/"}, {"number": 426, "title": "fix: MLflow oauth2-proxy ILB를 새 프로젝트 예약 IP로 교체 (#425)", "author": "hyeongyu-data", "merged_at": "2026-07-30T02:51:08Z", "summary_ko": ["MLflow oauth2-proxy의 내부 LoadBalancer IP를 구 프로젝트 주소(10.10.0.22)에서 신규 프로젝트 예약 IP(10.10.0.2)로 변경하였습니다.", "하드코딩된 IP로 인해 DNS 레코드와 실제 서비스 IP가 불일치하여 발생하던 접속 타임아웃 문제를 해결하였습니다.", "관련 매니페스트 및 인프라 문서의 IP 표기를 신규 예약 IP 및 Terraform output 참조 안내로 업데이트하였습니다."], "report_url": "pr/426/"}, {"number": 423, "title": "feat: batch-spot 노드풀 n2 전환 — E2 quota 한도 회피 (#422)", "author": "hyeongyu-data", "merged_at": "2026-07-30T01:59:19Z", "summary_ko": ["새 GCP 프로젝트의 E2_CPUS 할당량 한도로 인한 batch-spot 노드풀 버스트 오류 문제를 해결하였습니다.", "batch-spot GKE 노드풀의 기본 머신 타입을 e2-standard-2에서 n2-standard-2로 전환하였습니다.", "관련 Terraform 변수 정의 및 TERRAFORM_DEV.md 운영 문서를 최신 사양으로 업데이트하였습니다."], "report_url": "pr/423/"}, {"number": 421, "title": "feat: MLflow OAuth client id를 Secret Manager 정본으로 관리 (#420)", "author": "hyeongyu-data", "merged_at": "2026-07-30T01:33:06Z", "summary_ko": ["MLflow OAuth client id를 GCP Secret Manager 정본으로 관리하도록 Terraform 구성을 추가했습니다.", "OAuth client 비밀번호 및 ID 저장소의 우발적 삭제 방지를 위해 prevent_destroy 생명주기 규칙을 설정했습니다.", "쿠버네티스 시크릿 주입 문서에서 하드코딩된 클라이언트 ID를 제거하고 Secret Manager 기반 절차로 재작성했습니다."], "report_url": "pr/421/"}, {"number": 419, "title": "docs: 운영 문서 프로젝트 참조 일괄 갱신 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-30T01:14:14Z", "summary_ko": ["GCP 프로젝트 이전(#404) 완료에 따라 라이브 운영 문서 8종에 남아 있던 구 프로젝트 ID를 신규 프로젝트 ID로 일괄 갱신하였습니다.", "Terraform 구성에 MLflow OAuth client ID 저장을 위한 Secret Manager 리소스를 추가하고 이전 설정 백업 파일을 생성하였습니다.", "운영자가 실제 환경 접속 및 명령어 실행 시 구 프로젝트 참조로 인해 발생할 수 있는 혼선을 방지하도록 문서를 정합화하였습니다."], "report_url": "pr/419/"}, {"number": 418, "title": "docs: 피처 스토어 Environment 등록 절차 정정", "author": "hyochangsung", "merged_at": "2026-07-29T15:37:37Z", "summary_ko": ["피처 스토어 환경 변수(prod/dev Environment) 등록 절차와 좌표 동기화 주의사항을 문서에 명시했습니다.", "dev 환경의 main 브랜치 전용 배포 정책 및 환경 변수 주입 구조를 구체적으로 정립했습니다.", "첫 dev apply 실행 시 레지스트리 미존재로 인한 검증 건너뜀 현상과 이에 대한 수동 확인 명령을 추가했습니다."], "report_url": "pr/418/"}, {"number": 416, "title": "feat: admin-apply ROOTS에서 vault-k8s 제외 (#412 A단계)", "author": "hyochangsung", "merged_at": "2026-07-29T13:05:13Z", "summary_ko": ["Vault 인프라 드랍 결정(#412)에 따라 CI 자동 배포 파이프라인의 적용 대상 목록에서 vault-k8s 항목을 제외하였습니다.", "프로젝트 이전 이후 이전 프로젝트 설정을 참조하여 발생하던 Vault 관련 파드 실행 오류 및 자동 적용 시도를 차단하였습니다.", "관련 인프라 전체 요약 문서에서 K8s 관리 루트 개수 표기를 8개에서 7개로 일치하도록 업데이트하였습니다."], "report_url": "pr/416/"}, {"number": 414, "title": "fix: bootstrap state 버킷명을 default 없는 필수 변수로 전환", "author": "hyochangsung", "merged_at": "2026-07-29T12:48:33Z", "summary_ko": ["부트스트랩용 상태 저장 버킷 이름 변수의 기본값을 제거하여 필수 입력 항목으로 전환했습니다.", "프로젝트 전환 시 이전 프로젝트의 상태 저장 버킷 이름이 오용되거나 불필요한 버킷이 생성되는 위험을 차단했습니다.", "관련 부트스트랩 가이드 문서의 설정 예시와 옛 프로젝트 버킷명 표기를 최신 정보로 갱신했습니다."], "report_url": "pr/414/"}, {"number": 410, "title": "feat: Alertmanager Slack 알림과 노이즈 제어", "author": "Noah-JuYong", "merged_at": "2026-07-29T10:51:56Z", "summary_ko": ["기존 Gmail 기반 Alertmanager 알림을 Slack 웹훅 연동으로 전환하고 수신 대상을 핵심 네임스페이스 및 클러스터 장애로 제한하였습니다.", "경보 등급별 반복 주기 분리, resolved 메시지 자동 발송, 동일 경보의 critical 발동 시 warning 억제(inhibit) 규칙을 적용하였습니다.", "OOM 종료 경보를 최근 5분 내 재시작 연동 사건형 규칙으로 개선하고, 비노출 Secret 생성 및 롤백 운영 절차를 구축하였습니다."], "report_url": "pr/410/"}, {"number": 409, "title": "feat: 피처 스토어 dev 환경 좌표 프로비저닝 (#408)", "author": "hyochangsung", "merged_at": "2026-07-29T09:02:47Z", "summary_ko": ["오토리서치 에이전트 자율 실험을 위해 피처 스토어 dev 환경 좌표(BigQuery 데이터셋 및 테이블 5종)를 신설하였습니다.", "prod/dev 공통 컬럼 계약을 단일화하여 양 환경 간 피처 스키마 불일치를 방지하고 prod diff를 차단하였습니다.", "dev 환경용 Registry 및 Staging은 기존 버킷의 dev/ 경로를 공유하도록 지정하고 관련 output 및 가이드를 작성하였습니다."], "report_url": "pr/409/"}, {"number": 407, "title": "fix: deploy 이미지·버킷 참조를 새 프로젝트로 교체 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-29T07:39:09Z", "summary_ko": ["GCP 프로젝트 이전 작업(#404 Phase 5)의 일환으로 배포 매니페스트 내 기존 GCP 프로젝트 ID 참조를 신규 프로젝트 ID로 변경하였습니다.", "서빙 서비스(serving)의 컨테이너 이미지 경로, 프로젝트 ID 환경 변수, Feast 레지스트리 및 스테이징 GCS 버킷 주소를 업데이트하였습니다.", "MLflow 서비스(mlflow)의 컨테이너 이미지 경로, 프로젝트 환경 변수, 아티팩트 저장용 GCS 버킷 주소를 신규 프로젝트로 전환하였습니다."], "report_url": "pr/407/"}, {"number": 405, "title": "feat: 프로젝트 이전 Phase 0~1 — bootstrap 변수화·state backend 전환 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-29T05:07:21Z", "summary_ko": ["GCP 프로젝트 이전(#404)을 위해 모든 Terraform root의 원격 상태(state) 저장 버킷을 새 프로젝트 버킷으로 전환하였습니다.", "부트스트랩 모듈의 상태 버킷 이름을 변수화하여 글로벌 유니크 제약을 유연하게 처리할 수 있도록 개선하였습니다.", "GitHub Actions 워크플로, IAM 권한 바인딩 및 관련 운영 문서의 버킷 경로를 신규 버킷 기준으로 일괄 업데이트하였습니다."], "report_url": "pr/405/"}, {"number": 402, "title": "feat: 액션로그 KPO 메모리 프로파일 패널 (#401)", "author": "hyeongyu-data", "merged_at": "2026-07-28T09:00:09Z", "summary_ko": ["Airflow 대시보드에 액션로그 KubernetesPodOperator 파드의 메모리 사용량을 실시간 감시하는 패널을 추가하였습니다.", "애플리케이션 파드의 객체 메모리 누적 현상(시간당 +25~30MiB) 여부를 판별할 수 있는 프로메테우스 시계열 쿼리를 적용하였습니다.", "현재 파드 요청 자원 기준선인 512MiB를 점선 임계값으로 설정하고 누수 발생 판독 가이드를 대시보드 내에 포함했습니다."], "report_url": "pr/402/"}, {"number": 400, "title": "docs: Kibana TLS 비활성 결정 CHANGE_HISTORY 기록 (#394)", "author": "hyeongyu-data", "merged_at": "2026-07-28T08:41:29Z", "summary_ko": ["Kibana 브라우저 로그인 e2e 검증 중 밝혀진 TLS 세션 쿠키 문제와 해결 결정을 변경 이력 문서에 기록하였습니다.", "Kibana 자체 TLS를 비활성화하고 NetworkPolicy 및 oauth2-proxy 기반 접근 통제 모델로 전환한 배경을 보존합니다.", "향후 TLS 재활성화 시 프록시 설정 및 오브젝트 임포트 작업의 동반 수정 및 롤백 방침을 명시하였습니다."], "report_url": "pr/400/"}, {"number": 391, "title": "docs: Alertmanager OOM 검증 절차 정정", "author": "Noah-JuYong", "merged_at": "2026-07-28T07:06:07Z", "summary_ko": ["Alertmanager의 ContainerOOMKilled 알림 검증을 위한 테스트 Pod 설정과 관측 명령을 정정하였습니다.", "Prometheus 지표 특성상 컨테이너가 재시작되어야 종료 사유 지표가 생성되므로 restartPolicy를 Always로 변경하였습니다.", "실제 검증을 마친 Alertmanager SMTP 이메일 수신 상태를 관측 전략 및 운영 문서에 최신화하였습니다."], "report_url": "pr/391/"}, {"number": 399, "title": "docs: 에이전트 모델 선택·리뷰 위임 가이드 제거", "author": "hyochangsung", "merged_at": "2026-07-28T06:44:49Z", "summary_ko": ["AI 에이전트 가이드 중 실익이 적은 서브에이전트 모델 선택, 코드 리뷰, 계획 리뷰 가이드 문서 3종을 삭제하였습니다.", "에이전트 진입점 문서인 CLAUDE.md의 문서 탐색 표에서 삭제된 가이드 문서들에 대한 참조 행을 제거하였습니다.", "서브에이전트 위임으로 발생하는 불필요한 토큰 소비와 실행 시간 오버헤드를 절감하고 문서 구조를 간소화하였습니다."], "report_url": "pr/399/"}, {"number": 395, "title": "fix: Kibana 자체 TLS 비활성 — http 프록시 로그인 차단 해소 (#394)", "author": "hyeongyu-data", "merged_at": "2026-07-28T05:40:23Z", "summary_ko": ["Kibana 9.x 자체 TLS 서빙 시 보안 세션이 강제되어 HTTP 프록시 접속 환경에서 구글 로그인이 차단되던 현상을 해결하였습니다.", "Kibana 자체 TLS를 비활성화하여 HTTP로 전환하고 인증 프록시(oauth2-proxy) 및 초기 설정 불러오기 작업의 통신 경로를 수정하였습니다.", "Elasticsearch 및 Kibana 간 내부 통신 TLS는 유지하면서 클러스터 내부 구간 통신 및 관련 운영 문서를 정합화하였습니다."], "report_url": "pr/395/"}, {"number": 393, "title": "fix: serving 이미지 digest를 category_key 조인키 반영본으로 승격 (#358)", "author": "bbungjun", "merged_at": "2026-07-28T04:46:20Z", "summary_ko": ["서빙 배포 매니페스트의 이미지 digest를 Feast 스키마 변경사항이 반영된 최신 버전으로 교체합니다.", "조인키 변경(category_id -> category_key) 미반영으로 발생하던 /rerank API의 503 에러를 해결합니다.", "배포 매니페스트 수정 후 ArgoCD 수동 동기화를 거쳐 중단되었던 데이터 파이프라인의 복구를 유도합니다."], "report_url": "pr/393/"}, {"number": 384, "title": "feat: GKE VPA 관측 애드온 활성화", "author": "Noah-JuYong", "merged_at": "2026-07-27T13:38:59Z", "summary_ko": ["GKE dev 클러스터에 VPA(Vertical Pod Autoscaler) 애드온을 활성화하도록 Terraform 구성을 추가했습니다.", "Airflow scheduler 등의 리소스 사용량 관측을 위해 관측 전용(updateMode: Off) 적용 지침을 작성했습니다.", "VPA CRD 및 API 준비 상태 확인 명령어와 gated apply 및 롤백 절차를 운영 문서에 반영했습니다."], "report_url": "pr/384/"}, {"number": 383, "title": "feat: Autoresearch의 merge PR 아카이브 워크플로우 이식 (#382)", "author": "bbungjun", "merged_at": "2026-07-27T11:33:41Z", "summary_ko": ["Autoresearch 및 Autoresearch-airflow 저장소에서 사용 중인 merge PR 아카이브 생성기와 배포 워크플로우를 이식했습니다.", "GitHub Pages의 개별 PR 리포트 및 병합 메타데이터를 자동 수집하여 정적 아카이브 페이지와 인덱스를 구성합니다.", "PR 병합 및 리포트 생성 완료 시점에 GitHub Actions가 실행되어 gh-pages 루트의 검색 및 모아보기 페이지를 최신화합니다."], "report_url": "pr/383/"}, {"number": 377, "title": "feat: Autoresearch의 PR 이해 리포트 워크플로우 이식 (#376)", "author": "bbungjun", "merged_at": "2026-07-27T10:54:30Z", "summary_ko": ["다른 저장소에서 운영 중인 PR 이해 리포트 자동 생성 워크플로우를 본 저장소로 이식하였습니다.", "저장소 구조에 맞춰 파이프라인 노드 정본 정의와 참조 문서 경로를 새로 구성하였습니다.", "PR 생성 및 리뷰 요청 시 분석 리포트 페이지를 생성하고 GitHub Pages 링크를 코멘트로 제공합니다."], "report_url": "pr/377/"}]}</script>
