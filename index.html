<style>

6-08-10T17:33:13Z", "summary_ko": ["실험 런처의 동시 실행 상한 환경 변수를 기존 2건에서 5건으로 상향 조정했습니다.", "CI 매니페스트 검증 스크립트의 기대값과 운영 런북 및 변경 이력 문서를 5건 기준으로 함께 갱신했습니다.", "동시 2건 카나리 검증 통과를 바탕으로 인프라 용량 상향의 최종 배포 단계를 완료했습니다."], "report_url": "pr/626/"}, {"number": 625, "title": "feat: 실험 5건 실행 용량을 상향한다", "author": "bbungjun", "merged_at": "2026-08-10T15:54:10Z", "summary_ko": ["실험 동시 실행 용량을 2건에서 5건으로 확장하기 위해 Kubernetes 자원 할당량 및 제한 범위를 상향 조정하였습니다.", "batch-od 노드 풀 사양을 e2-standard-16으로 변경하여 5건의 실험 요청 자원을 단일 노드에서 수용하도록 설정하였습니다.", "목표 자원 설정을 검증하는 Terraform 계약 테스트와 관련 인프라 문서 및 단계적 배포 실행 계획을 반영하였습니다."], "report_url": "pr/625/"}, {"number": 618, "title": "feat: 실험 로그 수집기 배포 — 전용 SA·RoleBinding·Deployment (#616)", "author": "waieiches", "merged_at": "2026-08-10T05:30:37Z", "summary_ko": ["워크벤치 화면에서 실험 원본 로그를 실시간으로 수집·적재하기 위한 전용 로그 수집기 애플리케이션(Deployment)을 신규 배포했습니다.", "권한 최소화 원칙에 따라 기존 실행기 계정을 재사용하지 않고 로그 읽기와 데이터베이스 접근만 허용된 전용 계정(SA)을 신설했습니다.", "수집기 매니페스트 추가와 함께 실행기 컨테이너 이미지를 v0.13.0 버전으로 승격하고 승격 검증 자동화 스크립트를 반영했습니다."], "report_url": "pr/618/"}, {"number": 617, "title": "docs: 인프라 요약을 현재 코드와 정합화한다", "author": "bbungjun", "merged_at": "2026-08-10T03:43:51Z", "summary_ko": ["현재 Terraform, K8s, ArgoCD 및 Actions 워크플로우 구성을 반영하여 인프라 요약 문서를 현행화하였습니다.", "launcher 소유권, ARC Feast apply 경로, admin root 8개 등 실제 코드 기준의 인벤토리를 명시하였습니다.", "저장소 코드로 확인된 구성 상태와 과거 live 검증 상태를 명확히 구분하여 운영 오해를 방지하였습니다."], "report_url": "pr/617/"}, {"number": 614, "title": "fix: v0.12.1 executor·launcher digest 승격", "author": "bbungjun", "merged_at": "2026-08-09T23:38:50Z", "summary_ko": ["v0.12.1 수동 승격에 따라 실험 런처 및 이그제큐터의 신규 이미지 다이제스트를 매니페스트에 반영하였습니다.", "런처 매니페스트 정적 계약 검증 스크립트와 셀프 테스트 픽스처의 이미지 기댓값을 신규 좌표로 갱신하였습니다.", "변경 이력 문서와 실행 런북에 새로 반영된 이미지 다이제스트 정보, 검증 명령어, 롤백 절차를 명시하였습니다."], "report_url": "pr/614/"}, {"number": 612, "title": "fix: candidate-finalizer의 Codex 인증 mount를 계약에 반영한다", "author": "bbungjun", "merged_at": "2026-08-09T12:33:10Z", "summary_ko": ["v0.12.0 버전에서 리포트를 작성하는 Codex #2 실행을 위해 candidate-finalizer 컨테이너의 codex-home 마운트가 필요해졌습니다.", "기존 쿠버네티스 어드미션 검증 정책이 해당 마운트를 차단하여 생성된 작업이 422 오류로 거부되던 문제를 해결했습니다.", "허용 대상 컨테이너를 두 개로 엄격히 고정하고 보안 경계 무름과 잔여 위험, 적용 및 롤백 절차를 관련 문서에 명시했습니다."], "report_url": "pr/612/"}, {"number": 610, "title": "fix: v0.12.0 Agent Orchestration digest 승격", "author": "bbungjun", "merged_at": "2026-08-09T12:02:18Z", "summary_ko": ["Autoresearch main 커밋 8750bce에서 빌드된 Agent Orchestration v0.12.0 컨테이너 이미지 불변 다이제스트 5종을 매니페스트에 반영하였습니다.", "Codex 연동 계약 일치를 위해 실행 요청기(launcher)와 실행기(executor)를 포함한 5개 이미지 다이제스트를 원자적으로 동시 승격하였습니다.", "정적 계약 검증 스크립트와 셀프 테스트 기대값을 v0.12.0으로 동기화하고 변경 이력 및 롤백 운영 가이드를 추가하였습니다."], "report_url": "pr/610/"}, {"number": 605, "title": "fix: Stage 1 결과 게시 시간 설정 수정", "author": "bbungjun", "merged_at": "2026-08-09T06:59:28Z", "summary_ko": ["Stage 1 실험 결과 보존을 위해 실행 환경에 GCS 저장소 경로(ORCH_EXPERIMENT_RESULTS_ROOT)를 추가했습니다.", "8개 컨테이너 실행 및 채점에 필요한 시간을 확보하고자 작업 제한 시간을 60,000초, Codex 타임아웃을 6,000초로 상향했습니다.", "쿠버네티스 어드미션 정책 상한을 60,000초로 맞추고 매니페스트 검증 코드, 테스트, 운용 런북을 함께 갱신했습니다."], "report_url": "pr/605/"}, {"number": 608, "title": "fix: Agent Orchestration 5개 digest 승격", "author": "bbungjun", "merged_at": "2026-08-09T06:51:52Z", "summary_ko": ["Autoresearch v0.11.0 릴리스에서 검증된 5개 구성요소(API, UI, launcher, runner, executor)의 이미지 해시를 dev 매니페스트에 반영하였습니다.", "자동 승격 스크립트와 검증 테스트 대상에 executor 이미지를 추가하여 5개 구성요소 전체 승격 계약을 확장하였습니다.", "관련 배포 운영 문서 및 변경 이력을 업데이트하고 배포 선행 조건과 롤백 절차를 명시하였습니다."], "report_url": "pr/608/"}, {"number": 596, "title": "fix: persist executor-to-API ingress policy", "author": "bbungjun", "merged_at": "2026-08-09T06:32:00Z", "summary_ko": ["실험 실행 파드의 Experiment API 접근 허용 NetworkPolicy 규칙을 Git desired state에 영구 반영하였습니다.", "동일한 peer 내 네임스페이스 및 파드 셀렉터를 조합하여 특정 네임스페이스의 실행 파드만 TCP 8000 포트에 접근하도록 제한했습니다.", "배포 검증 스크립트 및 돌연변이 테스트를 통해 규칙 수 유효성과 셀렉터 분리 변형 감지 체계를 강화했습니다."], "report_url": "pr/596/"}, {"number": 602, "title": "feat: executor에 MLflow tracking 좌표와 egress를 추가한다", "author": "waieiches", "merged_at": "2026-08-08T23:46:35Z", "summary_ko": ["실험 실행기(executor) 파드가 클러스터 내 MLflow 추적 서버에 학습 기록을 남길 수 있도록 주소 환경변수를 추가했습니다.", "실행기 파드에서 클러스터 내 MLflow 서비스(TCP/5000)로 통신을 허용하는 NetworkPolicy Egress 규칙을 추가했습니다.", "환경변수 및 네트워크 정책 누락 시 학습 결과 유실이나 타임아웃이 발생하는 문제를 막기 위해 계약 검사 스크립트와 Terraform 테스트를 강화했습니다."], "report_url": "pr/602/"}, {"number": 601, "title": "fix: launcher 이미지 digest를 v0.10.0으로 승격한다 (#600)", "author": "waieiches", "merged_at": "2026-08-08T23:23:08Z", "summary_ko": ["외부 자동 승격 작업 실패로 미반영 상태였던 오케스트레이션 launcher 이미지를 v0.10.0 버전 digest로 수동 승격합니다.", "CronJob 배포 매니페스트와 이를 검증하는 루비 계약 스크립트 및 테스트 파일의 기대값을 동시 업데이트했습니다.", "로직 변경이 없는 executor 컨테이너 이미지는 기존 v0.9.3 버전을 유지하여 검증 안정성을 확보했습니다."], "report_url": "pr/601/"}, {"number": 598, "title": "fix: executor 이미지 digest를 v0.9.3으로 승격한다 (#597)", "author": "waieiches", "merged_at": "2026-08-08T16:37:45Z", "summary_ko": ["에이전트 오케스트레이션 executor 이미지 digest를 v0.9.2에서 v0.9.3으로 수동 승격하였습니다.", "자동 승격 스크립트 범위 밖이어서 발생했던 Git 매니페스트와 클러스터 실제 상태 간의 드리프트를 해결했습니다.", "향후 타 컴포넌트 자동 배포 시 executor가 이전 버전(v0.9.2)으로 예기치 않게 롤백되는 위험을 예방했습니다."], "report_url": "pr/598/"}, {"number": 594, "title": "feat: bump executor image digest to v0.9.1 for launcher", "author": "bbungjun", "merged_at": "2026-08-07T18:11:41Z", "summary_ko": ["실험 오케스트레이션 실행기(executor) 컨테이너 이미지를 v0.9.1 최신 디제스트로 업데이트하였습니다.", "CronJob 매니페스트 환경변수(ORCH_EXECUTOR_IMAGE)의 이미지 디제스트 해시값을 신규 v0.9.1 이미지로 변경하였습니다.", "매니페스트 계약 검증 스크립트 및 관련 단위 테스트의 기댓값을 신규 디제스트로 동기화하였습니다."], "report_url": "pr/594/"}, {"number": 593, "title": "feat: API v0.9.0 digest 승격", "author": "bbungjun", "merged_at": "2026-08-07T17:31:05Z", "summary_ko": ["PR #592의 launcher/executor 승격에 이어 Agent Orchestration API 이미지를 v0.9.0 디제스트로 원자적 승격하였습니다.", "API Deployment, Migration Job, Verification Job, Runner 및 Launcher의 총 7개 이미지 참조를 일괄 반영하였습니다.", "매니페스트 검증 계약 스크립트 및 디제스트 승격 테스트를 동기화하고 런북 및 변경 이력을 업데이트하였습니다."], "report_url": "pr/593/"}, {"number": 592, "title": "feat: v0.9.0 학습 executor 배선 활성화", "author": "bbungjun", "merged_at": "2026-08-07T17:09:14Z", "summary_ko": ["dev 환경의 agent-orchestration launcher 및 executor 이미지 digest를 v0.9.0 버전으로 교체했습니다.", "학습 snapshot URI와 필수 timeout 환경변수를 매니페스트에 배선하여 실제 모델 학습 및 ROC-AUC 평가가 가능하도록 설정했습니다.", "정적 검사 스크립트에 v0.9.0 필수 환경변수 검증 및 구식 dataset path 재유입 차단 규칙을 추가하고 운영 문서를 업데이트했습니다."], "report_url": "pr/592/"}, {"number": 590, "title": "feat: 실험 Job GSA에 실험 스냅샷 버킷 read 권한 추가", "author": "bbungjun", "merged_at": "2026-08-07T15:54:04Z", "summary_ko": ["실험 실행 파드(Job) GSA에 실제 학습 데이터 스냅샷이 존재하는 실험 결과 전용 버킷의 객체 읽기 권한(roles/storage.objectViewer)을 추가하였습니다.", "이전 PR(#577)에서 미적용 상태로 잘못 설정되어 있던 MLflow 아티팩트 버킷 대상 IAM 권한을 제거하고, Output 계약 좌표를 실제 게시 버킷으로 정정하였습니다.", "권한 반영 후 gcloud 및 gsutil을 활용한 정상 읽기 검증 절차와 문제 발생 시의 revert 기반 롤백 가이드를 운영 문서에 추가하였습니다."], "report_url": "pr/590/"}, {"number": 586, "title": "fix: Phase 2 executor digest를 승격한다", "author": "bbungjun", "merged_at": "2026-08-07T12:09:39Z", "summary_ko": ["Phase 2 구현 지시 계약 수정이 반영된 검증 완료 executor 컨테이너 이미지 digest를 승격했습니다.", "매니페스트 계약 검증 스크립트의 기대 executor 이미지 식별자를 동일하게 갱신했습니다.", "운영 런북 문서에 소스 커밋 SHA, 빌드 실행 번호 및 직전 롤백용 이미지 식별자 정보를 추가했습니다."], "report_url": "pr/586/"}, {"number": 588, "title": "feat: Agent Orchestration digest 승격 계약 추가", "author": "hyeongyu-data", "merged_at": "2026-08-07T10:10:06Z", "summary_ko": ["검증된 Agent Orchestration API 및 UI release digest를 main 브랜치 매니페스트에 자동 반영하는 승격 스크립트를 추가하였습니다.", "고정 GAR 레포지토리, sha256 digest 형식, 참조 수 및 API digest 일치 여부를 검증하는 self-test를 CI lint에 연결하였습니다.", "GitHub App 최소 권한 및 Ruleset bypass 설정, ArgoCD 연동 및 긴급 롤백 가이드를 다루는 운영 룬북과 문서를 새로 작성하였습니다."], "report_url": "pr/588/"}, {"number": 584, "title": "feat: 실험 Job GSA에 canonical 학습 스냅샷 read를 부여한다 (#577)", "author": "waieiches", "merged_at": "2026-08-07T08:52:19Z", "summary_ko": ["실험 executor 파드(GSA)가 학습 데이터 스냅샷을 읽을 수 있도록 GCS `training-snapshots/` prefix 대상 조회 권한을 부여했습니다.", "`experiment_job_execution_contract` Terraform output에 `training_snapshot_root_url` 좌표 정보를 추가했습니다.", "인프라 문서 상의 학습 스냅샷 prefix 경로 명세를 애플리케이션 실제 구현(`by-hash/`)에 맞추어 정정했습니다."], "report_url": "pr/584/"}, {"number": 580, "title": "feat: PostSync 배포 검증을 자동화한다 (#574)", "author": "hyeongyu-data", "merged_at": "2026-08-07T08:36:48Z", "summary_ko": ["ArgoCD 배포 직후(PostSync 단계) GKE 내부에서 Agent Orchestration API의 candidate endpoint를 자동 검증하는 Job을 도입하였습니다.", "외부 CI Runner에 Kubernetes 권한을 주는 대신 시크릿과 k8s API 권한이 전혀 없는 최소권한 Pod와 전용 NetworkPolicy를 구성하였습니다.", "검증 Job의 최소권한 계약과 이미지 digest 일치성을 검증하는 CI 스크립트 및 운영 런북 문서를 함께 추가하였습니다."], "report_url": "pr/580/"}, {"number": 583, "title": "chore: agent-orchestration API·UI digest를 v0.8.0으로 승격한다", "author": "hyochangsung", "merged_at": "2026-08-07T08:28:03Z", "summary_ko": ["Autoresearch v0.8.0 릴리즈에 맞춰 agent-orchestration API 및 UI 컨테이너 이미지 digest를 최신으로 승격하였습니다.", "API 이미지 digest가 사용되는 매니페스트 6곳과 매니페스트 계약 검사 스크립트의 하드코딩 참조값을 일치시켰습니다.", "v0.8.0 롤아웃 계획 문서 및 머지 후 ArgoCD 자동 동기화 시 DB 마이그레이션 확인 절차를 정리했습니다."], "report_url": "pr/583/"}, {"number": 581, "title": "fix: Phase 2 smoke 관측성을 배포한다", "author": "bbungjun", "merged_at": "2026-08-07T08:03:30Z", "summary_ko": ["Phase 2 실행 실패 원인을 추적할 수 있도록 오케스트레이터 CronJob의 launcher 및 executor 이미지 다이제스트를 업데이트했습니다.", "단일 smoke 테스트 동안 완주 증거 및 실패 이벤트를 수집하기 위해 완료된 Job의 보존 시간을 1시간(3600초)으로 설정했습니다.", "매니페스트 검증 스크립트와 자기 테스트를 보강하고, 테스트 완료 후 보존 시간을 정상 회수하는 운영 가이드를 작성했습니다."], "report_url": "pr/581/"}, {"number": 576, "title": "fix: API에 executor API token을 주입한다 (#575)", "author": "bbungjun", "merged_at": "2026-08-07T06:13:31Z", "summary_ko": ["Phase 2 API가 필수 요구하는 executor API token 환경 변수를 API Deployment 매니페스트에 추가 주입하였습니다.", "매니페스트 계약 검사 스크립트에 API 토큰 참조 검증 로직 및 테스트 케이스를 추가하여 은밀한 런타임 배포 실패를 방지하도록 개선하였습니다.", "네임스페이스 간 시크릿 사본 복제 방법, 운영 smoke 검증 게이트 4종, 롤백 가이드를 운영 문서에 반영하였습니다."], "report_url": "pr/576/"}, {"number": 571, "title": "docs: agent-orchestration ArgoCD sync 상태 문서 갱신", "author": "hyeongyu-data", "merged_at": "2026-08-07T05:53:36Z", "summary_ko": ["GitOps 전략 문서의 agent-orchestration 이관 상태를 실환경 ArgoCD 배포 상태에 맞게 갱신하였습니다.", "기존 '배포 준비(수동 sync)' 표기를 자동 동기화(automated sync)가 적용된 '완료(운영 중)' 상태로 수정하였습니다.", "실제 쿠버네티스 클러스터 및 ArgoCD 설정과 문서 사이의 불일치를 해소하였습니다."], "report_url": "pr/571/"}, {"number": 573, "title": "docs: agent-orchestration 런북을 #526 automated sync 기준으로 갱신", "author": "hyeongyu-data", "merged_at": "2026-08-07T05:42:51Z", "summary_ko": ["PR #526에서 변경된 ArgoCD 자동 동기화(main 추적) 모델에 맞춰 agent-orchestration GKE 운영 런북을 최신화하였습니다.", "수동 커밋 SHA 지정 및 수동 동기화 지시를 main 브랜치 자동 동기화 확인 절차로 수정하였습니다.", "최초 활성화, 시크릿 회전, 이미지 롤백 및 네트워크 정책 반영 등 런북 전반의 운영 순서를 정합성에 맞게 개정하였습니다."], "report_url": "pr/573/"}, {"number": 567, "title": "fix: Phase 2 API digest 승격 누락을 바로잡는다 (#566)", "author": "bbungjun", "merged_at": "2026-08-07T05:15:54Z", "summary_ko": ["Phase 2 API 이미지 승격 과정에서 누락되었던 3개 파일 5곳의 이미지 digest를 최신 버전으로 일괄 갱신했습니다.", "동일 디렉터리 내 매니페스트 간 이미지 digest 일관성을 자동 검증하는 스크립트 규칙을 추가했습니다.", "배포 시 구 버전 마이그레이션 실행으로 발생하던 DB 컬럼 미존재 에러 및 launcher 실패 현수를 해결했습니다."], "report_url": "pr/567/"}, {"number": 565, "title": "feat: 실험 Job 어드미션 계약을 일반화하고 Phase 2 executor 경계를 추가한다 (#562)", "author": "bbungjun", "merged_at": "2026-08-07T04:58:14Z", "summary_ko": ["실험 Job 어드미션 계약을 app.kubernetes.io/component 종류별 매핑 구조로 전환하여 여러 형태의 Job을 수용하도록 일반화했습니다.", "Phase 2 8-컨테이너 executor Job의 어드미션 검증 규칙, egress 네트워크 정책 및 launcher 환경변수 6종을 신설했습니다.", "비밀키 마운트 규칙을 허용 목록 방식으로 반전하여 Codex 컨테이너 자격 증명 유출을 방지하고 Phase 1 롤백 경로를 보존했습니다."], "report_url": "pr/565/"}, {"number": 564, "title": "chore: Agent Orchestration UI digest 승격", "author": "Noah-JuYong", "merged_at": "2026-08-07T03:39:53Z", "summary_ko": ["Autoresearch PR #572의 Streamlit UI 기능 변경사항을 dev GKE 환경에 반영하기 위해 UI 이미지 digest를 승격하였습니다.", "agent-orchestration-ui 쿠버네티스 매니페스트의 컨테이너 이미지 digest를 검증된 신규 digest로 업데이트하였습니다.", "롤아웃 실행 목적, 검증 정보, 적용 절차 및 롤백 가이드를 명시한 실행 문서를 추가하였습니다."], "report_url": "pr/564/"}, {"number": 560, "title": "docs: ARC 리스너/컨트롤러 라벨 drift 점검 절차를 런북에 추가 (#559)", "author": "hyeongyu-data", "merged_at": "2026-08-06T07:44:57Z", "summary_ko": ["Actions Runner Controller(ARC) 네트워크 정책의 라벨 불일치 현상을 점검하는 절차를 운영 런북 문서에 추가하였습니다.", "차트 업그레이드로 라벨이 바뀌어 리스너가 API 서버 통신에 실패하고 재시작을 반복하는 문제를 방지하기 위해 작성되었습니다.", "인프라 적용 후 리스너 및 컨트롤러 파드의 정상 작동 여부와 재시작 횟수를 확인하는 kubectl 검증 명령을 안내합니다."], "report_url": "pr/560/"}, {"number": 556, "title": "docs: 인프라 문서 최신화 감사 반영", "author": "hyeongyu-data", "merged_at": "2026-08-06T07:33:40Z", "summary_ko": ["실제 GitHub PR 상태 및 라이브 클러스터 점검 결과를 바탕으로 변경 이력과 인프라 요약 문서를 최신화했습니다.", "실험 Job 경계의 배포 완료 상태와 런처 CronJob의 1분 주기 정상 실행 현황을 문서에 명시했습니다.", "GCP 기본값이 그대로 적용 중인 노드당 파드 수, Cloud NAT 포트, SQL 백업 보존 기간 등을 문서화했습니다."], "report_url": "pr/556/"}, {"number": 558, "title": "fix: 리스너 K8s API egress를 scale-set-name 대신 component 라벨로 스코프", "author": "hyeongyu-data", "merged_at": "2026-08-06T07:09:58Z", "summary_ko": ["작업 감시용 리스너 Pod가 쿠버네티스 API 서버에 접근하지 못해 지속적으로 재시작되던 문제를 해결합니다.", "네트워크 보안 정책의 라벨 선택자를 특정 스케일셋에서 전체 리스너 공통 라벨로 변경하였습니다.", "실제 명령을 실행하는 작업자 Pod의 API 접근은 차단하여 보안상 최소 권한 원칙을 계속 유지합니다."], "report_url": "pr/558/"}, {"number": 547, "title": "feat: GitHub 메타데이터 규칙 강제", "author": "hyeongyu-data", "merged_at": "2026-08-06T04:58:05Z", "summary_ko": ["이슈 및 PR 생성 시 담당자 지정과 라벨 부여를 자동으로 보정하는 워크플로우를 추가하였습니다.", "PR 브랜치명이 영문 명명 규칙을 따르는지 검사하는 워크플로우와 main 브랜치 보호 규칙을 설정하였습니다.", "PR 템플릿, 기여 가이드 문서, 에이전트 지침 및 설계 계획 문서를 함께 업데이트하였습니다."], "report_url": "pr/547/"}, {"number": 552, "title": "feat: 실험 브랜치 launcher 배포를 추가한다", "author": "bbungjun", "merged_at": "2026-08-06T04:52:46Z", "summary_ko": ["실험 브랜치 자동 생성을 전담하는 1분 주기 CronJob launcher 및 전용 NetworkPolicy 매니페스트를 배포 구성에 추가하였습니다.", "애플리케이션 최신 릴리스 산출물인 launcher, executor, API의 불변 이미지 디제스트(digest)를 매니페스트에 일괄 반영하였습니다.", "매니페스트 설정 계약을 검증하는 CI 테스트 스크립트와 릴리스 출처 정보 및 롤백 가이드 문서를 작성하였습니다."], "report_url": "pr/552/"}, {"number": 545, "title": "feat: feast apply 셀프 호스티드 러너 이관 인프라·검증 워크플로우 구성 (#541)", "author": "hyeongyu-data", "merged_at": "2026-08-06T04:47:12Z", "summary_ko": ["feast apply 작업을 셀프 호스티드 러너(ARC) 스케일셋 기반으로 전환하기 위한 Kubernetes KSA, NetworkPolicy, ArgoCD Application 인프라를 구성했습니다.", "GCS 도달성과 environment별 Redis PSC 네트워크 접근 권한(dev 차단 음성대조, prod 허용)을 검증하는 수동 프로브 워크플로우를 추가했습니다.", "인프라 순환 의존성 및 장애 전파 방지를 위해 Terraform apply 운영 배포는 GitHub 호스티드 러너 격리 상태를 유지하도록 결정하고 문서화했습니다."], "report_url": "pr/545/"}, {"number": 540, "title": "feat: 실험 브랜치 launcher·executor 인프라 추가", "author": "bbungjun", "merged_at": "2026-08-06T03:21:10Z", "summary_ko": ["실험 브랜치 자동 생성을 위한 launcher 전용 서비스 계정 및 Kubernetes RBAC 권한 경계를 구축했습니다.", "기존 API 서비스 계정이 보유하던 Kubernetes Job 생성 권한을 회수하여 단일 목적의 launcher 서비스 계정으로 이관했습니다.", "GitHub App 개인키 유출을 방지하는 7종의 어드미션 제어 정책, 전용 네트워크 Egress 규칙 및 운영 문서를 추가했습니다."], "report_url": "pr/540/"}, {"number": 549, "title": "fix: Feast apply WIF provider 조건을 환경별 workflow_ref로 분리", "author": "hyochangsung", "merged_at": "2026-08-06T02:26:56Z", "summary_ko": ["Feast apply용 GCP Workload Identity Provider의 조건을 단일 workflow_ref에서 dev/prod 환경별 목록으로 분리하였습니다.", "dev 브랜치 push 및 main에서의 dispatch 실행 시 dev WIF 토큰 발급이 거부되던 조건 결함을 수정하였습니다.", "bootstrap 루트가 CI 자동 apply 대상이 아님을 문서화하고 담당자의 로컬 apply 필요성을 명시하였습니다."], "report_url": "pr/549/"}, {"number": 543, "title": "docs: 초기 spec·plan 원문 복구", "author": "hyeongyu-data", "merged_at": "2026-08-05T17:49:15Z", "summary_ko": ["과거 PR에서 삭제되었던 초기 인프라 설계 스펙 문서 10종과 구현 계획 문서 10종을 원문 그대로 복구하였습니다.", "복구된 문서들은 과거 의사결정 이력 및 맥락을 제공하며 실제 GCP 인프라 상태에는 어떠한 영향을 주지 않습니다.", "현행 인프라 운영 및 개발 절차는 기존 정본 문서인 TEAM_OPERATIONS_RUNBOOK.md 및 TERRAFORM_DEV.md를 우선합니다."], "report_url": "pr/543/"}, {"number": 538, "title": "docs: Task 7 라이브 검증 결과 기록 (#535)", "author": "hyeongyu-data", "merged_at": "2026-08-05T12:14:30Z", "summary_ko": ["Actions Runner Controller(ARC) PoC 작업 중 Task 7의 라이브 검증 결과를 계획 문서에 기록하였습니다.", "승인 대기 중 발생한 Access Token 만료 대응 및 Listener Pod 크래시 원인 분석 결과를 명시하였습니다.", "NetworkPolicy 음성 대조군 실험 결과(Kubernetes API 통신 차단 및 복구 검증)를 추가 기록하였습니다."], "report_url": "pr/538/"}, {"number": 537, "title": "fix: NetworkPolicy K8s API egress 음성 대조군 원복 (#535)", "author": "hyeongyu-data", "merged_at": "2026-08-05T12:04:11Z", "summary_ko": ["GitHub Actions 러너의 음성 대조군 실험을 위해 주석 처리했던 쿠버네티스 API 아웃바운드 네트워크 규칙을 원복했습니다.", "cluster_services_cidr 및 cluster_master_cidr 대역으로의 TCP 443 포트 egress 허용 정책을 다시 활성화했습니다.", "실험 결과 네트워크 정책 차단 시 API 접속 타임아웃이 발생함을 확인하여 가설 검증 후 정상 복구 조치를 진행합니다."], "report_url": "pr/537/"}, {"number": 536, "title": "exp: NetworkPolicy K8s API egress 음성 대조군 (#535)", "author": "hyeongyu-data", "merged_at": "2026-08-05T11:51:27Z", "summary_ko": ["GitHub Actions 러너에서 Kubernetes API 서버로 향하는 443 포트 Egress 허용 규칙 2개를 일시적으로 주석 처리하였습니다.", "이전 워크플로우 성공 사례가 실제로 해당 Egress 허용 규칙에 의존하는지 입증하기 위한 음성 대조군 실험입니다.", "정책 전체를 삭제하면 기본 전체 허용으로 우회되므로 개별 규칙만 차단하였으며, 검증 직후 원복될 예정입니다."], "report_url": "pr/536/"}, {"number": 534, "title": "feat: 셀프 호스티드 러너(ARC) PoC 인프라 구성 (#533)", "author": "hyeongyu-data", "merged_at": "2026-08-05T09:23:23Z", "summary_ko": ["GitHub Actions 셀프 호스티드 러너(ARC) 구성을 위한 GCP GSA, Secret Manager 및 K8s 격리 경계를 신설하였습니다.", "ARC 컨트롤러 및 스케일셋용 OCI 차트를 감싸는 umbrella chart 2종을 작성하고 ArgoCD Application 및 CI apply 파이프라인에 통합하였습니다.", "VPC 내부망(Kubernetes API 서버) 도달성을 비파괴적으로 검증하는 PoC 워크플로우와 GitHub App 자격 증명 관리 런북을 마련하였습니다."], "report_url": "pr/534/"}, {"number": 529, "title": "fix: raw-data staging cleanup IAM 조건을 publish_staging_raw로 재스코핑", "author": "hyeongyu-data", "merged_at": "2026-08-05T06:21:26Z", "summary_ko": ["앱 저장소 변경으로 원자적 게시 임시 파일 위치가 변경됨에 따라 Airflow 배치 작업용 GCS IAM 삭제 조건 스코프를 수정했습니다.", "IAM 조건을 임시 파일 전용 경로로 재스코핑하여 이미 완료된 데이터에 대한 삭제·덮어쓰기 권한을 차단하고 최소 권한 원칙을 강화했습니다.", "IAM 조건 및 데이터 경로 계약 회귀를 방지하기 위해 CI lint 스크립트와 셀프 테스트를 새로 도입했습니다."], "report_url": "pr/529/"}, {"number": 524, "title": "docs: batch-od 유휴 상태 반영해 실험 Job capacity 서술 수정 (#523)", "author": "hyeongyu-data", "merged_at": "2026-08-05T05:36:30Z", "summary_ko": ["batch-od 노드 풀이 실제 유휴 상태임을 확인하여 관련 문서의 경합 및 용량 서술을 현실에 맞게 수정하였습니다.", "multi-container Pod 생성 시 발생할 수 있는 쿼터 무한 점유를 방지하도록 LimitRange에 Pod 합계 리소스 상한을 추가하였습니다.", "실험 Job 활성화 직전 batch-od 사용 여부를 재확인하기 위한 구체적인 검증 명령어와 절차를 문서화하였습니다."], "report_url": "pr/524/"}, {"number": 521, "title": "docs: raw_data staging cleanup IAM 결정을 CHANGE_HISTORY에 기록 (#514)", "author": "hyeongyu-data", "merged_at": "2026-08-04T11:13:20Z", "summary_ko": ["GCS 객체 IAM 조건에서 정규식 CEL 함수 미지원 제약과 경로 prefix 기반 IAM 재설계 결정을 문서화했습니다.", "docs/CHANGE_HISTORY.md에 실측 테스트 결과, CEL 제약 사항, 보안 트레이드오프를 변경 이력으로 기록했습니다.", "docs/TERRAFORM_DEV.md에 action_logs_raw prefix의 IAM 조건 연동 특성 및 Airflow batch SA 권한 예외를 반영했습니다."], "report_url": "pr/521/"}, {"number": 517, "title": "fix: airflow-batch SA에 raw-data staging 삭제 권한 추가", "author": "hyeongyu-data", "merged_at": "2026-08-04T07:46:22Z", "summary_ko": ["Airflow 배치 계정에 raw-data 버킷 내 action log 경로 대상 객체 삭제 및 수정 권한(roles/storage.objectUser)을 추가했습니다.", "GCS IAM 조건의 표현식 제약으로 파일명 접미사 대신 경로 prefix 기준 IAM CEL 조건을 적용했습니다.", "프로젝트 이전 후 원자적 게시(copy+delete) 과정에서 staging 임시 파일이 잔류하던 이슈(#514)를 해결했습니다."], "report_url": "pr/517/"}, {"number": 519, "title": "deploy: KST UI 이미지로 승격", "author": "Noah-JuYong", "merged_at": "2026-08-04T07:00:17Z", "summary_ko": ["Streamlit UI 컨테이너 이미지를 KST 시간대 표기 변경이 포함된 최신 불변 다이제스트로 교체했습니다.", "에이전트 오케스트레이션 UI Kubernetes Deployment 매니페스트 파일의 image 태그를 업데이트했습니다.", "배포 반영 시 화면에 표시되는 운영 시간이 한국 표준시(KST) 기준으로 정확히 제공됩니다."], "report_url": "pr/519/"}, {"number": 516, "title": "chore: vault-k8s 카탈로그·backend root 항목 제거", "author": "hyeongyu-data", "merged_at": "2026-08-04T06:35:53Z", "summary_ko": ["vault-k8s 원격 상태(state) 정리 완료에 따라 환경 설정 파일 및 스크립트에서 잔여 코드 참조를 완전히 제거했습니다.", "환경 카탈로그 스크립트와 설정 YAML에서 vault-k8s 루트 및 미사용 변수(ui_ingress_source_cidr)를 삭제했습니다.", "배포 워크플로우 주석과 스크립트 테스트 픽스처 데이터까지 정리를 완료하여 관련 이슈(#478)를 완결했습니다."], "report_url": "pr/516/"}, {"number": 513, "title": "feat: 내부 Streamlit UI 배포 추가", "author": "Noah-JuYong", "merged_at": "2026-08-04T05:49:56Z", "summary_ko": ["팀 내부 검증용 Streamlit Experiment Workbench 배포를 위한 GKE Deployment와 ClusterIP Service 매니페스트를 추가했습니다.", "UI Pod는 비루트·read-only 파일시스템 기반으로 제한하며, API 통신(TCP 8000)과 DNS Egress만 허용하는 NetworkPolicy 경계를 설정했습니다.", "이미지 다이제스트 주입, port-forward 기반 내부 접근 및 롤백 절차를 다루는 운영 룬북과 설계 문서를 보강했습니다."], "report_url": "pr/513/"}, {"number": 508, "title": "fix: optimized serving digest 승격", "author": "bbungjun", "merged_at": "2026-08-02T14:47:38Z", "summary_ko": ["dev GKE 환경의 서빙 Deployment 이미지 다이제스트를 최신 optimized 빌드로 승격했습니다.", "앱 release workflow(source SHA: 8ea99fe)에서 검증된 불변 이미지를 반영했습니다.", "ArgoCD 동기화 후 파드의 정상 기동을 확인하고 optimized 부하테스트를 진행할 예정입니다."], "report_url": "pr/508/"}, {"number": 510, "title": "feat: Experiment API migration 배포 추가", "author": "Noah-JuYong", "merged_at": "2026-08-02T13:19:22Z", "summary_ko": ["Experiment API v0 배포 전 Alembic DB 마이그레이션을 자동 수행하는 ArgoCD PreSync Job을 신규 추가하였습니다.", "검증된 이미지 디제스트(digest)를 API, Runner, Migration 등 5개 컨테이너 참조에 원자적으로 동일하게 반영하였습니다.", "마이그레이션 및 이미지 계약 검증 스크립트와 통합 테스트, 운영 런북 및 배포 문서를 함께 업데이트하였습니다."], "report_url": "pr/510/"}, {"number": 500, "title": "chore: 사용하지 않는 Vault 구성 완전 제거", "author": "hyeongyu-data", "merged_at": "2026-08-02T09:44:14Z", "summary_ko": ["시크릿 관리가 Secret Manager로 대체됨에 따라 더 이상 사용하지 않는 Vault 관련 Terraform 코드와 admin root를 완전히 제거하였습니다.", "GCP 특성상 삭제가 불가능한 KMS Key Ring 및 Crypto Key는 별도 파일로 분리하여 삭제 방지 속성과 함께 영구 관리하도록 구성하였습니다.", "CI 워크플로우의 plan 요약 추출 정규식을 통일하고 워크플로우 간 불일치를 검증하는 일관성 체크 스크립트를 추가하였습니다."], "report_url": "pr/500/"}, {"number": 506, "title": "fix: Prometheus proxy resource name 수정", "author": "bbungjun", "merged_at": "2026-08-02T07:52:05Z", "summary_ko": ["Prometheus 프록시 스냅샷 읽기 권한의 Kubernetes 서비스 리소스 이름을 실제 요청 스킴과 포트가 포함된 전체 형식으로 수정했습니다.", "Kubernetes Role의 services/proxy 권한 대상을 http:kube-prometheus-stack-prometheus:9090으로 명시하여 API 권한 거부 문제를 해결했습니다.", "변경된 리소스 이름 계약을 검증하기 위해 Terraform 통합 테스트 사례를 신규 추가했습니다."], "report_url": "pr/506/"}, {"number": 502, "title": "fix: rerank baseline serving digest 복원", "author": "bbungjun", "merged_at": "2026-08-02T06:12:41Z", "summary_ko": ["서빙 배포 매니페스트의 컨테이너 이미지 digest를 rerank baseline 이미지 버전으로 복원합니다.", "이전 승격 작업으로 변경되었던 서빙 이미지를 부하테스트 기준 이미지(sha256:f323791e...)로 재설정합니다.", "실제 클러스터 배포 이미지를 일치시켜 loadtest 실행 시 정확한 baseline 성능 비교가 가능하도록 합니다."], "report_url": "pr/502/"}, {"number": 499, "title": "feat: ArgoCD OIDC Secret Manager 정본 2종을 IaC로 편입", "author": "hyeongyu-data", "merged_at": "2026-08-02T05:01:57Z", "summary_ko": ["라이브 환경에만 수동으로 존재하던 ArgoCD Google OIDC 인증용 Secret Manager 리소스 2종을 Terraform 코드(IaC)로 편입하였습니다.", "기존 라이브 리소스 이름을 유지하여 스크립트 및 Helm 설정 수정을 방지하고, 삭제 방지(prevent_destroy) 옵션을 추가하여 안정성을 높였습니다.", "상세 설계 문서를 신규 작성하고, 마이그레이션 런북 및 ArgoCD 운영 문서의 시크릿 인벤토리 정보를 최신화하였습니다."], "report_url": "pr/499/"}, {"number": 498, "title": "docs: agent-orchestration ArgoCD 핀 갱신 절차와 egress 선행 조건 명문화", "author": "hyeongyu-data", "merged_at": "2026-08-02T05:00:06Z", "summary_ko": ["인프라 권한 설정과 네트워크 정책 간 배포 경로 차이로 발생할 수 있는 운영상 공백을 방지하도록 런북을 보완하였습니다.", "머지 커밋 갱신, 권한 적용, 네트워크 정책 동기화, 실제 연결 검증으로 이어지는 절차 순서를 명확히 정의하였습니다.", "실험 작업 생성 기능을 활성화하기 전에 네트워크 출입 규칙이 반영되었는지 미리 검증할 수 있는 점검 수단을 추가하였습니다."], "report_url": "pr/498/"}, {"number": 483, "title": "docs: Google OAuth 운영 규약 통합", "author": "hyeongyu-data", "merged_at": "2026-08-02T04:18:05Z", "summary_ko": ["ArgoCD, Airflow, MLflow, Grafana, Kibana의 Google OAuth 운영 규약을 단일 런북 문서로 통합 작성하였습니다.", "Secret Manager 정본과 Kubernetes Secret 실행 사본 간의 연동 및 자격증명·허용목록 갱신/롤백 절차를 표준화하였습니다.", "런타임 인증 로직과 시크릿 키는 변경하지 않으며 기존 운영 문서와 인프라 요약의 링크 및 문구를 업데이트하였습니다."], "report_url": "pr/483/"}, {"number": 496, "title": "chore: manifest serving 이미지 digest 승격", "author": "waieiches", "merged_at": "2026-08-02T03:58:40Z", "summary_ko": ["서빙 애플리케이션의 컨테이너 이미지 다이제스트를 신규 버전으로 승격합니다.", "manifest 기반 챔피언 모델(version 19)을 반영한 서빙 이미지를 dev 환경에 배포합니다.", "이미지 다이제스트 외의 인프라 설정, 네트워크 정책, 시크릿 등은 변경 없이 유지합니다."], "report_url": "pr/496/"}, {"number": 480, "title": "docs: 이전 런북 실측 상세 보강 — 사고 근거·후속 조치·리뷰 발견 반영 (#477)", "author": "hyeongyu-data", "merged_at": "2026-08-02T03:44:35Z", "summary_ko": ["GCP 프로젝트 이전 런북에 트러블슈팅 경험, 에러 원문 및 실측 수치를 상세히 보강하였습니다.", "PR 인라인 리뷰에서 파악된 시크릿 관리 함정과 서비스 계정 설정 누락 방지책을 집약하였습니다.", "프로젝트 이전 완료에 따른 후속 조치 내역을 반영하고 관련 설계 및 이력 문서를 최신화하였습니다."], "report_url": "pr/480/"}, {"number": 492, "title": "feat: dev 환경 좌표 카탈로그를 추가", "author": "hyeongyu-data", "merged_at": "2026-08-02T03:43:00Z", "summary_ko": ["개발 환경의 GCP 프로젝트, 리전, 네트워크 대역, 상태 저장 버킷 등 비비밀 인프라 좌표를 단일 카탈로그로 일원화했습니다.", "카탈로그 검증 스크립트와 실행 도구를 도입하여 테라폼 입력 변수와 상태 저장소 설정을 자동으로 생성·주입하도록 구현했습니다.", "자동화 검증 단계에서 카탈로그 사전 대조 ) 매칭을 추가했습니다.", "moved 블록만 존재하는 plan 실행 시 요약 리포트에서 리소스 이동 내역이 누락되던 문제를 해결했습니다.", "apply, terraform-plan, terraform-drift 등 3개 CI/CD 워크플로우 전체에 일관되게 반영했습니다."], "report_url": "pr/469/"}, {"number": 463, "title": "refactor: apply SA WI 바인딩 _unified 접미사 정리", "author": "hyeongyu-data", "merged_at": "2026-07-31T07:44:54Z", "summary_ko": ["CI 워크플로우용 서비스 계정 IAM 바인딩 리소스명에서 임시 표현이었던 접미사를 정리하였습니다.", "권한 재구성에 따른 CI 인증 중단을 막기 위해 Terraform moved 블록을 선언하였습니다.", "실제 구글 클라우드 리소스 변경 없이 테라폼 상태(State) 기록상의 주소만 안전하게 이전하였습니다."], "report_url": "pr/463/"}, {"number": 454, "title": "feat: 오케스트레이션 GKE 배포 경계 추가", "author": "Noah-JuYong", "merged_at": "2026-07-31T06:30:04Z", "summary_ko": ["에이전트 오케스트레이션 API 및 Codex Runner를 dev GKE 클러스터 내부 전용으로 배포하기 위한 인프라 경계를 신설하였습니다.", "전용 DB, Secret Manager 시크릿, 분리된 Workload Identity 및 NetworkPolicy를 적용하여 최소 권한 및 격리를 구현하였습니다.", "ArgoCD 수동 동기화 검증 조건과 배포, DB 역할 이관, OAuth 초기화, 롤백, 서비스 폐기 절차를 다루는 룬북을 추가하였습니다."], "report_url": "pr/454/"}, {"number": 461, "title": "feat: Prometheus retentionSize 25GiB — 시간+크기 이중 리텐션 (#459)", "author": "hyeongyu-data", "merged_at": "2026-07-31T03:04:46Z", "summary_ko": ["프로메테우스 지표 데이터 보관 정책에 기존 7일 시간 기준 외에 25GiB 크기 상한을 추가했습니다.", "카디널리티 급증 시 디스크(30GiB) 용량 초과로 프로메테우스 파드가 멈추는 장애 경로를 차단합니다.", "Helm 설정 반영 및 ArgoCD 동기화 후 파드 롤링 재기동을 통해 용량 제어 플래그를 적용합니다."], "report_url": "pr/461/"}, {"number": 462, "title": "feat: ArgoCD 자동 sync 전환 — main 머지 즉시 반영, prune 제외 (#460)", "author": "hyeongyu-data", "merged_at": "2026-07-31T02:53:21Z", "summary_ko": ["ArgoCD가 관리하는 4개 애플리케이션(monitoring, argo-rollouts, mlflow, serving)의 동기화 정책을 자동(automated)으로 전환했습니다.", "자동 삭제(prune) 및 수동 드리프트 자동 원복(selfHeal)은 비활성화(false)하여 무단 리소스 삭제나 의도치 않은 수동 조치 원복을 방지했습니다.", "GitOps 운영 전략 문서(GITOPS_STRATEGY.md)를 최신 자동 동기화 방침에 맞게 업데이트했습니다."], "report_url": "pr/462/"}, {"number": 457, "title": "docs: apply workflow 단일 진입점(#451) 최종 검증 결과 기록", "author": "hyeongyu-data", "merged_at": "2026-07-31T01:46:31Z", "summary_ko": ["통합 apply 워크플로우(#451)의 3단계 작업 완료 내역과 최종 실검증 결과를 문서에 반영하였습니다.", "실제 `scope: all` 실행으로 dev/admin 환경의 apply 및 서비스 계정 전환 통합 경로가 정상 동작함을 실증하였습니다.", "본 PR은 변경 이력 문서(`docs/CHANGE_HISTORY.md`) 업데이트만 포함하며 인프라 코드 변경은 없습니다."], "report_url": "pr/457/"}, {"number": 456, "title": "feat: apply SA의 옛 workflow_ref 바인딩·변수 제거 (#451 3단계)", "author": "hyeongyu-data", "merged_at": "2026-07-31T01:28:22Z", "summary_ko": ["통합 배포 진입점 이관(#451)의 마무리를 위해 옛 배포 워크플로우 전용 IAM 바인딩 2건을 삭제했습니다.", "더 이상 사용하지 않는 이전 배포용 변수 2종을 제거하고, 유지되는 통합 바인딩의 설명 주석을 최신화했습니다.", "리소스 재생성(replace) 위험 없이 죽은 권한만 순수 삭제하여 보안성과 관리성을 높였습니다."], "report_url": "pr/456/"}, {"number": 455, "title": "feat: apply workflow를 단일 진입점(apply.yml)으로 통합 (#451 2단계)", "author": "hyeongyu-data", "merged_at": "2026-07-31T00:45:52Z", "summary_ko": ["기존 삼원화되어 있던 Terraform apply 워크플로우(admin-apply, dev-apply, terraform-apply)를 apply.yml 하나로 통합하였습니다.", "한 번의 수동 실행으로 dev root 및 7개 admin root 전체를 plan하고, Environment 승인 1회로 일괄 적용하도록 개선하였습니다.", "동일 job 내 스텝별 GCP 계정 전환과 스텝 스코프 시크릿 주입을 통해 권한 경계 및 보안성을 최우선으로 유지하였습니다."], "report_url": "pr/455/"}, {"number": 452, "title": "feat: apply SA 2종에 통합 진입점(apply.yml) WI 바인딩 추가 (#451 1단계)", "author": "hyeongyu-data", "merged_at": "2026-07-30T08:53:19Z", "summary_ko": ["배포 워크플로우 통합(#451)의 1단계 작업으로 신규 통합 진입점(apply.yml)에 대한 Workload Identity 바인딩을 선행 추가하였습니다.", "기존 admin 및 dev 배포 권한을 유지한 채 신규 경로 바인딩만 추가하여 워크플로우 교체 시 CI 권한 상실 위험을 방지하였습니다.", "이번 변경은 역할 추가 없이 동일 서비스 계정에 인가 주체만 추가하는 작업이며 기존 자동화 실행 환경에 영향을 주지 않습니다."], "report_url": "pr/452/"}, {"number": 450, "title": "docs: apply workflow 통합(#448) 왕복 검증 결과 기록", "author": "hyeongyu-data", "merged_at": "2026-07-30T07:57:45Z", "summary_ko": ["이전 작업(#448)에서 진행한 apply 워크플로우 통합에 대한 머지 후 왕복 검증 실측 결과를 변경 이력 문서에 반영하였습니다.", "dev-apply 및 admin-apply 수동 실행을 통해 OIDC 권한 인증 전제와 GCS plan 저장 경로의 정상 동작을 입증하였습니다.", "실행 취소로 남아있던 GCS plan 객체 8건을 수동 삭제하고 이를 검증 수순의 일부로 함께 명시하였습니다."], "report_url": "pr/450/"}, {"number": 449, "title": "refactor: apply workflow 공용 구현을 재사용 워크플로우로 통합 (#448)", "author": "hyeongyu-data", "merged_at": "2026-07-30T07:37:29Z", "summary_ko": ["관리자 및 개발 환경의 테라폼 배포 파이프라인 중복 코드를 재사용 워크플로우로 통합하였습니다.", "GCP IAM 가장 조건(WIF workflow_ref)을 유지하기 위해 기존 워크플로우 진입점 구조는 그대로 보존하였습니다.", "파이프라인 로직 불일치 위험을 해소하고 관련 설명 및 변경 이력을 운영 문서에 반영하였습니다."], "report_url": "pr/449/"}, {"number": 447, "title": "docs: deploy 좌표 변수화 검토 spec — 보류(환경 분리 트리거) 권고 (#441)", "author": "hyeongyu-data", "merged_at": "2026-07-30T06:31:46Z", "summary_ko": ["배포 매니페스트 내 GCP 프로젝트 좌표 변수화 방안에 대한 비교 검토 사양 문서를 추가하였습니다.", "Kustomize 도입(안 A)과 현행 유지 및 런북 방어(안 B)를 비교하여 현행 유지 및 보류(안 B)를 최종 권고하였습니다.", "단일 dev 환경에서의 구조적 복잡성을 피하고 추후 staging/prod 분리 시점에 Kustomize 도입을 재검토하기로 결정하였습니다."], "report_url": "pr/447/"}, {"number": 446, "title": "docs: 첫 apply 닭-달걀 검토 spec — 안 B(현행 유지) 권고 (#440)", "author": "hyeongyu-data", "merged_at": "2026-07-30T06:31:04Z", "summary_ko": ["인프라 재구축 시 발생하는 '첫 apply 닭-달걀' 순환 문제 해결 방안을 검토한 설계 스펙 문서를 추가하였습니다.", "apply 전용 서비스 계정을 bootstrap으로 이관하는 안 A와 현행 구조를 유지하는 안 B의 트레이드오프를 비교 분석하였습니다.", "상시 관리 리스크 및 권한 경계를 고려하여 현행 유지 및 절차 명문화를 골자로 하는 '안 B'를 최종 권고하였습니다."], "report_url": "pr/446/"}, {"number": 445, "title": "feat: OAuth 자격 SM 정본화 확장(Grafana·Kibana) + 반영 검증 스크립트 (#439)", "author": "hyeongyu-data", "merged_at": "2026-07-30T06:30:22Z", "summary_ko": ["Grafana 및 Kibana UI의 OAuth 클라이언트 자격을 Secret Manager 정본 리소스로 추가 정의하여 보안 통합 관리를 확장했습니다.", "5개 웹 UI 서비스의 OAuth client ID 및 Secret 설정이 정본과 일치하는지 자격 정보 노출 없이 검증하는 스크립트를 신설했습니다.", "Grafana 및 Elastic-Kibana 운영 런북의 자격 주입 절차를 터미널 직접 입력에서 Secret Manager 정본 다운로드 방식으로 개정했습니다."], "report_url": "pr/445/"}, {"number": 444, "title": "feat: DB random_password URI-safe 하드닝 (#438) — apply는 파이프라인 완주 후 조율", "author": "hyeongyu-data", "merged_at": "2026-07-30T06:29:19Z", "summary_ko": ["Cloud SQL 앱 유저 및 MLflow DB 비밀번호 생성용 특수문자를 URI-safe 문자(-_.~)로 제한하도록 변경했습니다.", "DB 접속 URI에 비밀번호가 원문 삽입될 때 발생하는 주소 파싱 오류 및 서비스 크래시 문제를 근본적으로 예방합니다.", "비밀번호 교체(rotate)가 유발되므로, 실행 중인 파이프라인 완주 후 수동 시크릿 재주입 절차와 함께 apply를 조율합니다."], "report_url": "pr/444/"}, {"number": 443, "title": "docs: 프로젝트 이전/재구축 실행 런북 신설 (#437)", "author": "hyeongyu-data", "merged_at": "2026-07-30T06:25:56Z", "summary_ko": ["GCP 프로젝트 이전 및 클러스터 재구축 작업을 위한 실행 런북 문서(MIGRATION_RUNBOOK.md)를 신설했습니다.", "이전 프로젝트 이전 경험(#404) 실측을 바탕으로 부트스트랩부터 검증까지 Phase 0~6 단계별 실행 절차를 정리했습니다.", "Secret 전수 순회 명령 기반 추출, Cloud SQL 데이터 이전 순서 등 이전 중 발생했던 장애 요인의 재발 방지책을 명시했습니다."], "report_url": "pr/443/"}, {"number": 442, "title": "feat: admin-apply ROOTS 순서 교정·신선 클러스터 선행 단계 명문화 (#436)", "author": "hyeongyu-data", "merged_at": "2026-07-30T06:14:00Z", "summary_ko": ["신선 클러스터 재구축 시 배포 실패를 방지하기 위해 admin-apply CI 워크플로우의 실행 순서를 교정하였습니다.", "Airflow 네임스페이스를 먼저 생성하도록 airflow-k8s 모듈을 autoresearch-k8s 선행 단계로 배치하였습니다.", "CRD operator 선적용 및 Secret 사전 주입 등 클러스터 초기 구축에 필요한 선행 작업 절차를 워크플로우 주석에 명문화하였습니다."], "report_url": "pr/442/"}, {"number": 435, "title": "docs: 전 문서 감사 — 이전 잔재·Vault 드랍·불일치 32건 일괄 정합 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-30T05:47:51Z", "summary_ko": ["저장소 내 전체 운영 문서(15종)를 전수 검수하여 GCP 프로젝트 이전(#404) 및 Vault 드랍(#412) 등에 따른 서술 불일치 32건을 일괄 정정하였습니다.", "자원 확장 정책 변경(#330/#331/#422)에 맞춰 Grafana 모니터링 대시보드의 스케일 판정 기준과 노드풀 최대 상한 수치를 최신화하였습니다.", "팀원 접근 경로, 시크릿 주입 명령 방식, 브랜치 승인 규칙 실측 상태 등 실제 인프라 구현과 다르게 서술되어 있던 운영 절차를 현행화하였습니다."], "report_url": "pr/435/"}, {"number": 434, "title": "fix: Feast apply GSA account_id 30자 제한 초과 수정 (#433)", "author": "hyochangsung", "merged_at": "2026-07-30T05:41:55Z", "summary_ko": ["GCP 서비스 계정 식별자(account_id)의 30자 길이 제한을 초과해 발생하던 Terraform plan 오류를 수정했습니다.", "Feast apply용 서비스 계정 이름을 'autoresearch-dev-feast-dev/prod'로 축소하고 K8s Workload Identity 설정을 일치시켰습니다.", "쿠버네티스 네임스페이스 이름은 유지하되 관련 운영 문서 및 구성 예시 파일들을 변경된 이름으로 일괄 갱신했습니다."], "report_url": "pr/434/"}, {"number": 431, "title": "feat: Feast 런타임 환경 IAM 및 GCS 경계 분리", "author": "hyochangsung", "merged_at": "2026-07-30T05:20:13Z", "summary_ko": ["단일 GCP 프로젝트 내에서 Feast apply 실행의 개발(dev)과 운영(prod) 런타임 경계를 완전히 격리하였습니다.", "환경별 전용 서비스 계정, GCS 버킷, BigQuery 데이터셋, K8s 네임스페이스 및 네트워크 정책을 분리 구성하였습니다.", "WIF 제공자를 환경별로 신설하고 운영(prod) 환경에만 Redis 연결 및 CA 보안 비밀 접근 권한을 한정 부여하였습니다."], "report_url": "pr/431/"}, {"number": 429, "title": "docs: 이전 마무리 정합 — batch-spot 현행화·CHANGE_HISTORY 기록 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-30T05:12:47Z", "summary_ko": ["GCP 프로젝트 이전 작업(#404)에 따른 전체 인프라 재구축 히스토리와 주요 결정 사항을 변경 이력 문서에 기록했습니다.", "실제 적용된 배치용 스팟 노드풀 사양(n2-standard-2 및 최대 8개)을 인프라 요약 문서에 반영했습니다.", "문서와 실제 GCP 인프라 환경 간의 정보 정합성을 완성하여 팀원들의 운영 혼선을 예방하도록 개선했습니다."], "report_url": "pr/429/"}, {"number": 430, "title": "fix: Filebeat 평문 로그 JSON 오류 마커 제거", "author": "hyeongyu-data", "merged_at": "2026-07-30T04:51:12Z", "summary_ko": ["Filebeat ndjson 파서의 add_error_key 옵션을 false로 변경하였습니다.", "비JSON 평문 로그 수집 시 불필요하게 추가되던 error.type=json 오류 마커를 제거하였습니다.", "Kibana 운영 런북 문서의 평문 로그 폴백 관련 설명을 최신 동작에 맞게 업데이트하였습니다."], "report_url": "pr/430/"}, {"number": 428, "title": "fix: airflow 배치 KSA를 airflow-k8s root로 IaC 편입 (#427)", "author": "hyeongyu-data", "merged_at": "2026-07-30T03:27:15Z", "summary_ko": ["Airflow 배치 작업용 서비스 계정(KSA)을 테라폼 코드(airflow-k8s 루트)로 정식 편입했습니다.", "수동 kubectl 명령에 의존하던 환경 재구축 시의 계정 누락 위험을 근본적으로 차단했습니다.", "기존 응급 생성 리소스를 테라폼 상태로 입양(import)하여 기존 배치 실행 영향 없이 안전하게 반영했습니다."], "report_url": "pr/428/"}, {"number": 426, "title": "fix: MLflow oauth2-proxy ILB를 새 프로젝트 예약 IP로 교체 (#425)", "author": "hyeongyu-data", "merged_at": "2026-07-30T02:51:08Z", "summary_ko": ["MLflow oauth2-proxy의 내부 LoadBalancer IP를 구 프로젝트 주소(10.10.0.22)에서 신규 프로젝트 예약 IP(10.10.0.2)로 변경하였습니다.", "하드코딩된 IP로 인해 DNS 레코드와 실제 서비스 IP가 불일치하여 발생하던 접속 타임아웃 문제를 해결하였습니다.", "관련 매니페스트 및 인프라 문서의 IP 표기를 신규 예약 IP 및 Terraform output 참조 안내로 업데이트하였습니다."], "report_url": "pr/426/"}, {"number": 423, "title": "feat: batch-spot 노드풀 n2 전환 — E2 quota 한도 회피 (#422)", "author": "hyeongyu-data", "merged_at": "2026-07-30T01:59:19Z", "summary_ko": ["새 GCP 프로젝트의 E2_CPUS 할당량 한도로 인한 batch-spot 노드풀 버스트 오류 문제를 해결하였습니다.", "batch-spot GKE 노드풀의 기본 머신 타입을 e2-standard-2에서 n2-standard-2로 전환하였습니다.", "관련 Terraform 변수 정의 및 TERRAFORM_DEV.md 운영 문서를 최신 사양으로 업데이트하였습니다."], "report_url": "pr/423/"}, {"number": 421, "title": "feat: MLflow OAuth client id를 Secret Manager 정본으로 관리 (#420)", "author": "hyeongyu-data", "merged_at": "2026-07-30T01:33:06Z", "summary_ko": ["MLflow OAuth client id를 GCP Secret Manager 정본으로 관리하도록 Terraform 구성을 추가했습니다.", "OAuth client 비밀번호 및 ID 저장소의 우발적 삭제 방지를 위해 prevent_destroy 생명주기 규칙을 설정했습니다.", "쿠버네티스 시크릿 주입 문서에서 하드코딩된 클라이언트 ID를 제거하고 Secret Manager 기반 절차로 재작성했습니다."], "report_url": "pr/421/"}, {"number": 419, "title": "docs: 운영 문서 프로젝트 참조 일괄 갱신 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-30T01:14:14Z", "summary_ko": ["GCP 프로젝트 이전(#404) 완료에 따라 라이브 운영 문서 8종에 남아 있던 구 프로젝트 ID를 신규 프로젝트 ID로 일괄 갱신하였습니다.", "Terraform 구성에 MLflow OAuth client ID 저장을 위한 Secret Manager 리소스를 추가하고 이전 설정 백업 파일을 생성하였습니다.", "운영자가 실제 환경 접속 및 명령어 실행 시 구 프로젝트 참조로 인해 발생할 수 있는 혼선을 방지하도록 문서를 정합화하였습니다."], "report_url": "pr/419/"}, {"number": 418, "title": "docs: 피처 스토어 Environment 등록 절차 정정", "author": "hyochangsung", "merged_at": "2026-07-29T15:37:37Z", "summary_ko": ["피처 스토어 환경 변수(prod/dev Environment) 등록 절차와 좌표 동기화 주의사항을 문서에 명시했습니다.", "dev 환경의 main 브랜치 전용 배포 정책 및 환경 변수 주입 구조를 구체적으로 정립했습니다.", "첫 dev apply 실행 시 레지스트리 미존재로 인한 검증 건너뜀 현상과 이에 대한 수동 확인 명령을 추가했습니다."], "report_url": "pr/418/"}, {"number": 416, "title": "feat: admin-apply ROOTS에서 vault-k8s 제외 (#412 A단계)", "author": "hyochangsung", "merged_at": "2026-07-29T13:05:13Z", "summary_ko": ["Vault 인프라 드랍 결정(#412)에 따라 CI 자동 배포 파이프라인의 적용 대상 목록에서 vault-k8s 항목을 제외하였습니다.", "프로젝트 이전 이후 이전 프로젝트 설정을 참조하여 발생하던 Vault 관련 파드 실행 오류 및 자동 적용 시도를 차단하였습니다.", "관련 인프라 전체 요약 문서에서 K8s 관리 루트 개수 표기를 8개에서 7개로 일치하도록 업데이트하였습니다."], "report_url": "pr/416/"}, {"number": 414, "title": "fix: bootstrap state 버킷명을 default 없는 필수 변수로 전환", "author": "hyochangsung", "merged_at": "2026-07-29T12:48:33Z", "summary_ko": ["부트스트랩용 상태 저장 버킷 이름 변수의 기본값을 제거하여 필수 입력 항목으로 전환했습니다.", "프로젝트 전환 시 이전 프로젝트의 상태 저장 버킷 이름이 오용되거나 불필요한 버킷이 생성되는 위험을 차단했습니다.", "관련 부트스트랩 가이드 문서의 설정 예시와 옛 프로젝트 버킷명 표기를 최신 정보로 갱신했습니다."], "report_url": "pr/414/"}, {"number": 410, "title": "feat: Alertmanager Slack 알림과 노이즈 제어", "author": "Noah-JuYong", "merged_at": "2026-07-29T10:51:56Z", "summary_ko": ["기존 Gmail 기반 Alertmanager 알림을 Slack 웹훅 연동으로 전환하고 수신 대상을 핵심 네임스페이스 및 클러스터 장애로 제한하였습니다.", "경보 등급별 반복 주기 분리, resolved 메시지 자동 발송, 동일 경보의 critical 발동 시 warning 억제(inhibit) 규칙을 적용하였습니다.", "OOM 종료 경보를 최근 5분 내 재시작 연동 사건형 규칙으로 개선하고, 비노출 Secret 생성 및 롤백 운영 절차를 구축하였습니다."], "report_url": "pr/410/"}, {"number": 409, "title": "feat: 피처 스토어 dev 환경 좌표 프로비저닝 (#408)", "author": "hyochangsung", "merged_at": "2026-07-29T09:02:47Z", "summary_ko": ["오토리서치 에이전트 자율 실험을 위해 피처 스토어 dev 환경 좌표(BigQuery 데이터셋 및 테이블 5종)를 신설하였습니다.", "prod/dev 공통 컬럼 계약을 단일화하여 양 환경 간 피처 스키마 불일치를 방지하고 prod diff를 차단하였습니다.", "dev 환경용 Registry 및 Staging은 기존 버킷의 dev/ 경로를 공유하도록 지정하고 관련 output 및 가이드를 작성하였습니다."], "report_url": "pr/409/"}, {"number": 407, "title": "fix: deploy 이미지·버킷 참조를 새 프로젝트로 교체 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-29T07:39:09Z", "summary_ko": ["GCP 프로젝트 이전 작업(#404 Phase 5)의 일환으로 배포 매니페스트 내 기존 GCP 프로젝트 ID 참조를 신규 프로젝트 ID로 변경하였습니다.", "서빙 서비스(serving)의 컨테이너 이미지 경로, 프로젝트 ID 환경 변수, Feast 레지스트리 및 스테이징 GCS 버킷 주소를 업데이트하였습니다.", "MLflow 서비스(mlflow)의 컨테이너 이미지 경로, 프로젝트 환경 변수, 아티팩트 저장용 GCS 버킷 주소를 신규 프로젝트로 전환하였습니다."], "report_url": "pr/407/"}, {"number": 405, "title": "feat: 프로젝트 이전 Phase 0~1 — bootstrap 변수화·state backend 전환 (#404)", "author": "hyeongyu-data", "merged_at": "2026-07-29T05:07:21Z", "summary_ko": ["GCP 프로젝트 이전(#404)을 위해 모든 Terraform root의 원격 상태(state) 저장 버킷을 새 프로젝트 버킷으로 전환하였습니다.", "부트스트랩 모듈의 상태 버킷 이름을 변수화하여 글로벌 유니크 제약을 유연하게 처리할 수 있도록 개선하였습니다.", "GitHub Actions 워크플로, IAM 권한 바인딩 및 관련 운영 문서의 버킷 경로를 신규 버킷 기준으로 일괄 업데이트하였습니다."], "report_url": "pr/405/"}, {"number": 402, "title": "feat: 액션로그 KPO 메모리 프로파일 패널 (#401)", "author": "hyeongyu-data", "merged_at": "2026-07-28T09:00:09Z", "summary_ko": ["Airflow 대시보드에 액션로그 KubernetesPodOperator 파드의 메모리 사용량을 실시간 감시하는 패널을 추가하였습니다.", "애플리케이션 파드의 객체 메모리 누적 현상(시간당 +25~30MiB) 여부를 판별할 수 있는 프로메테우스 시계열 쿼리를 적용하였습니다.", "현재 파드 요청 자원 기준선인 512MiB를 점선 임계값으로 설정하고 누수 발생 판독 가이드를 대시보드 내에 포함했습니다."], "report_url": "pr/402/"}, {"number": 400, "title": "docs: Kibana TLS 비활성 결정 CHANGE_HISTORY 기록 (#394)", "author": "hyeongyu-data", "merged_at": "2026-07-28T08:41:29Z", "summary_ko": ["Kibana 브라우저 로그인 e2e 검증 중 밝혀진 TLS 세션 쿠키 문제와 해결 결정을 변경 이력 문서에 기록하였습니다.", "Kibana 자체 TLS를 비활성화하고 NetworkPolicy 및 oauth2-proxy 기반 접근 통제 모델로 전환한 배경을 보존합니다.", "향후 TLS 재활성화 시 프록시 설정 및 오브젝트 임포트 작업의 동반 수정 및 롤백 방침을 명시하였습니다."], "report_url": "pr/400/"}, {"number": 391, "title": "docs: Alertmanager OOM 검증 절차 정정", "author": "Noah-JuYong", "merged_at": "2026-07-28T07:06:07Z", "summary_ko": ["Alertmanager의 ContainerOOMKilled 알림 검증을 위한 테스트 Pod 설정과 관측 명령을 정정하였습니다.", "Prometheus 지표 특성상 컨테이너가 재시작되어야 종료 사유 지표가 생성되므로 restartPolicy를 Always로 변경하였습니다.", "실제 검증을 마친 Alertmanager SMTP 이메일 수신 상태를 관측 전략 및 운영 문서에 최신화하였습니다."], "report_url": "pr/391/"}, {"number": 399, "title": "docs: 에이전트 모델 선택·리뷰 위임 가이드 제거", "author": "hyochangsung", "merged_at": "2026-07-28T06:44:49Z", "summary_ko": ["AI 에이전트 가이드 중 실익이 적은 서브에이전트 모델 선택, 코드 리뷰, 계획 리뷰 가이드 문서 3종을 삭제하였습니다.", "에이전트 진입점 문서인 CLAUDE.md의 문서 탐색 표에서 삭제된 가이드 문서들에 대한 참조 행을 제거하였습니다.", "서브에이전트 위임으로 발생하는 불필요한 토큰 소비와 실행 시간 오버헤드를 절감하고 문서 구조를 간소화하였습니다."], "report_url": "pr/399/"}, {"number": 395, "title": "fix: Kibana 자체 TLS 비활성 — http 프록시 로그인 차단 해소 (#394)", "author": "hyeongyu-data", "merged_at": "2026-07-28T05:40:23Z", "summary_ko": ["Kibana 9.x 자체 TLS 서빙 시 보안 세션이 강제되어 HTTP 프록시 접속 환경에서 구글 로그인이 차단되던 현상을 해결하였습니다.", "Kibana 자체 TLS를 비활성화하여 HTTP로 전환하고 인증 프록시(oauth2-proxy) 및 초기 설정 불러오기 작업의 통신 경로를 수정하였습니다.", "Elasticsearch 및 Kibana 간 내부 통신 TLS는 유지하면서 클러스터 내부 구간 통신 및 관련 운영 문서를 정합화하였습니다."], "report_url": "pr/395/"}, {"number": 393, "title": "fix: serving 이미지 digest를 category_key 조인키 반영본으로 승격 (#358)", "author": "bbungjun", "merged_at": "2026-07-28T04:46:20Z", "summary_ko": ["서빙 배포 매니페스트의 이미지 digest를 Feast 스키마 변경사항이 반영된 최신 버전으로 교체합니다.", "조인키 변경(category_id -> category_key) 미반영으로 발생하던 /rerank API의 503 에러를 해결합니다.", "배포 매니페스트 수정 후 ArgoCD 수동 동기화를 거쳐 중단되었던 데이터 파이프라인의 복구를 유도합니다."], "report_url": "pr/393/"}, {"number": 384, "title": "feat: GKE VPA 관측 애드온 활성화", "author": "Noah-JuYong", "merged_at": "2026-07-27T13:38:59Z", "summary_ko": ["GKE dev 클러스터에 VPA(Vertical Pod Autoscaler) 애드온을 활성화하도록 Terraform 구성을 추가했습니다.", "Airflow scheduler 등의 리소스 사용량 관측을 위해 관측 전용(updateMode: Off) 적용 지침을 작성했습니다.", "VPA CRD 및 API 준비 상태 확인 명령어와 gated apply 및 롤백 절차를 운영 문서에 반영했습니다."], "report_url": "pr/384/"}, {"number": 383, "title": "feat: Autoresearch의 merge PR 아카이브 워크플로우 이식 (#382)", "author": "bbungjun", "merged_at": "2026-07-27T11:33:41Z", "summary_ko": ["Autoresearch 및 Autoresearch-airflow 저장소에서 사용 중인 merge PR 아카이브 생성기와 배포 워크플로우를 이식했습니다.", "GitHub Pages의 개별 PR 리포트 및 병합 메타데이터를 자동 수집하여 정적 아카이브 페이지와 인덱스를 구성합니다.", "PR 병합 및 리포트 생성 완료 시점에 GitHub Actions가 실행되어 gh-pages 루트의 검색 및 모아보기 페이지를 최신화합니다."], "report_url": "pr/383/"}, {"number": 377, "title": "feat: Autoresearch의 PR 이해 리포트 워크플로우 이식 (#376)", "author": "bbungjun", "merged_at": "2026-07-27T10:54:30Z", "summary_ko": ["다른 저장소에서 운영 중인 PR 이해 리포트 자동 생성 워크플로우를 본 저장소로 이식하였습니다.", "저장소 구조에 맞춰 파이프라인 노드 정본 정의와 참조 문서 경로를 새로 구성하였습니다.", "PR 생성 및 리뷰 요청 시 분석 리포트 페이지를 생성하고 GitHub Pages 링크를 코멘트로 제공합니다."], "report_url": "pr/377/"}]}</script>
